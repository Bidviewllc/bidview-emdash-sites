name: Notify Slack on new PR
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
jobs:
  slack:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          HOOK: ${{ secrets.SLACK_ALERTS_WEBHOOK }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          CU=""
          case "$BRANCH" in
            dev-agent/*) TID="${BRANCH#dev-agent/}"; CU=" · :clipboard: <https://app.clickup.com/t/$TID|Review the ClickUp task>";;
          esac
          TEXT=":git: *New PR to review* — <$PR_URL|#$PR_NUM $PR_TITLE> on \`$REPO\` by $PR_USER$CU"
          jq -n --arg t "$TEXT" '{text:$t}' | curl -s -X POST -H 'Content-type: application/json' -d @- "$HOOK"
