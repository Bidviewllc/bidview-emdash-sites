<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listing Detail — Grant C. Meyer Homes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=Noto+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

  <!-- The site design system. This page used to re-implement ~300 lines of it in an
       inline <style> block, which is why it drifted from the design. Everything the
       listing sections need — .listing-hero--fl, .aside-fl, .filmstrip, .feat-card,
       .guide-fl, .invite, .lb — already lives in these two files. -->
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/responsive.css" />

  <style>
    /* Only what is genuinely specific to this page and NOT in styles.css. */

    /* --- Nav: none of it lives here any more. The header is .nav from styles.css
           and the drawer is .nav__drawer from responsive.css, the same as every
           other page. The old bar was position:sticky so the hero started beneath
           it; .nav is fixed, so body padding reserves that space instead — same
           result, and the photo still starts below the bar rather than under it.
           A bare `nav {}` rule must never come back here: the drawer's link list
           is a <nav> and it inherited the positioning last time. --- */
    body { padding-top: 96px; }

    /* --- "Back to all listings" bar. No design counterpart; kept because it is the
           way back for anyone arriving from the listings grid. --- */
    .back-bar { padding: 20px 48px; border-bottom: 1px solid var(--line); background: var(--cream); }
    .back-btn { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
    .back-btn:hover { color: var(--navy); }

    /* --- "A Note From Grant" + its inline admin editor. Not part of the design, so
           not in styles.css. Public when a note exists; editable when logged in. --- */
    .grant-note {
      margin-top: 32px; padding: 24px 28px; background: var(--beige);
      border-left: 3px solid var(--orange); border-radius: 4px;
    }
    .grant-note--empty { background: #fff; border-left-color: var(--line); }
    .grant-note__label {
      font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--orange); margin-bottom: 10px;
    }
    .grant-note--empty .grant-note__label { color: var(--muted); }
    .grant-note__body { font-family: var(--font-serif); font-size: 18px; line-height: 1.7; color: var(--navy); }
    .grant-note__body em { color: var(--muted); font-size: 15px; }
    .grant-note__btn {
      margin-top: 14px; font-family: var(--font-sans); font-size: 12px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--navy);
      border: 1px solid var(--line); border-radius: 3px; padding: 8px 16px; background: #fff;
    }
    .grant-note__btn:hover { border-color: var(--navy); }
    .grant-note__btn--save { background: var(--navy); color: #fff; border-color: var(--navy); }
    .grant-note__editor { margin-top: 14px; }
    .grant-note__editor textarea {
      width: 100%; font-family: var(--font-sans); font-size: 15px; line-height: 1.6; color: var(--ink);
      border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; resize: vertical; background: #fff;
    }
    .grant-note__editor textarea:focus { outline: none; border-color: var(--orange); }
    .grant-note__actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .grant-note__status { font-family: var(--font-sans); font-size: 12px; }

    /* --- Rich-text property description (Portable Text from the CMS). --- */
    .prop-desc__body { font-size: 17px; line-height: 1.8; color: var(--body); }
    .prop-desc__body p { margin: 0 0 16px; }
    .prop-desc__body p:last-child { margin-bottom: 0; }
    .prop-desc__body h1, .prop-desc__body h2, .prop-desc__body h3, .prop-desc__body h4 { font-family: var(--font-serif); color: var(--navy); margin: 24px 0 12px; line-height: 1.25; }
    .prop-desc__body h3 { font-size: 22px; } .prop-desc__body h4 { font-size: 18px; }
    .prop-desc__body ul, .prop-desc__body ol { margin: 0 0 16px; padding-left: 22px; }
    .prop-desc__body li { margin: 4px 0; }
    .prop-desc__body blockquote { margin: 16px 0; padding: 8px 18px; border-left: 3px solid var(--orange); color: var(--navy); font-style: italic; }
    .prop-desc__body a { color: var(--orange); text-decoration: underline; }
    .prop-desc__flag { margin-top: 12px; font-family: var(--font-sans); font-size: 12px; font-weight: 600; color: var(--orange); }

    /* --- .aside-fl__cta was authored for a <button>; used here as a link, which is
           inline by default, so it needs an explicit box. --- */
    a.aside-fl__cta { display: block; text-align: center; text-decoration: none; }

    /* --- Quick Statistics: dark panel, design typography. ONLY colours are
           overridden here. Every size, weight, letter-spacing and gap still comes
           from .aside-fl in styles.css, so the type now matches the design while
           the panel stays dark. --- */
    .aside-fl--dark { background: var(--navy); }
    .aside-fl--dark .aside-fl__h {
      color: rgba(255, 255, 255, 0.55);
      border-bottom-color: rgba(255, 255, 255, 0.14);
    }
    .aside-fl--dark .aside-fl__row { border-bottom-color: rgba(255, 255, 255, 0.10); }
    .aside-fl--dark .aside-fl__row__l { color: rgba(255, 255, 255, 0.62); }
    .aside-fl--dark .aside-fl__row__v { color: var(--white); }

    /* --- Loading state --- */
    .loading { text-align: center; padding: 220px 40px; color: var(--muted); }
    .loading__spinner { width: 40px; height: 40px; border: 3px solid var(--line); border-top-color: var(--navy); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ======================================================================
       PRINT — a two-page property sheet, not a screenshot of the web page
       ======================================================================
       The printer button (window.print()) used to hand over the page as-is:
       an 800px photo hero with white text on a background image the printer
       drops, then the filmstrip, the 3D-tour panel, the horizontally-scrolled
       features carousel (only the first card visible), the guide portrait, the
       market card and the whole inquiry form and footer.

       What prints now: a header sheet with the primary photo, address and the
       headline numbers; the description; Quick Statistics; every feature card
       as a plain list (no carousel); and Grant's note if there is one. That is
       the set a buyer or an agent actually wants on paper.

       Two things drive most of the rules below:
       - Browsers omit CSS background-images from print by default, so anything
         that is a background on screen either gets a real <img> for print
         (.print-sheet__img) or is hidden. Nothing relies on the reader having
         turned "background graphics" on.
       - Colour is inverted where the screen uses white-on-navy, so the ink is
         dark on white rather than a solid navy block. */
    .print-sheet, .print-foot { display: none; }

    @media print {
      @page { size: letter portrait; margin: 14mm 14mm 16mm; }

      html, body { background: #fff !important; padding-top: 0 !important; }
      body { font-size: 11pt; color: #000; }

      /* --- Everything that is navigation, marketing or interactive --- */
      .nav, .nav__drawer, .nav__scrim, .back-bar, .footer,
      .listing-hero, .filmstrip-section, .section--features .features-nav,
      .matterport, .section--market, .section--community, .section--guide-fl,
      #listing-contact, .lightbox, .listing-hero__share,
      .grant-note__btn, .grant-note__editor, .grant-note__status,
      .prop-desc__flag, .aside-fl__cta, .cta-arrow {
        display: none !important;
      }

      /* --- The print-only header sheet --- */
      .print-sheet { display: block; page-break-after: avoid; }
      .print-sheet__img {
        width: 100%; height: 78mm; object-fit: cover;
        border-radius: 2mm; margin-bottom: 6mm;
      }
      .print-sheet__head {
        display: flex; align-items: center; justify-content: space-between;
        gap: 8mm; padding-bottom: 3mm; border-bottom: 0.4mm solid #c5c6ce;
      }
      .print-sheet__logo { height: 16mm; width: auto; }
      .print-sheet__crumb {
        font-family: 'Manrope', sans-serif; font-size: 8pt; letter-spacing: 0.18em;
        text-transform: uppercase; color: #44474d; text-align: right;
      }
      .print-sheet__addr {
        font-family: 'Noto Serif', Georgia, serif; font-weight: 400;
        font-size: 24pt; line-height: 1.12; color: #15243b; margin: 5mm 0 3mm;
      }
      .print-sheet__facts {
        display: flex; align-items: baseline; gap: 6mm; flex-wrap: wrap;
        font-family: 'Manrope', sans-serif; font-size: 10pt; font-weight: 600;
        letter-spacing: 0.1em; color: #44474d;
      }
      .print-sheet__price {
        font-family: 'Noto Serif', Georgia, serif; font-size: 16pt;
        font-weight: 400; letter-spacing: 0; color: #15243b; margin-left: auto;
      }

      /* --- Description + Quick Statistics: one column, then the other --- */
      .listing-body { padding: 0 !important; background: #fff !important; }
      .listing-body__grid { display: block !important; }
      .listing-body__h--figma { font-size: 15pt; margin-top: 8mm; }
      .listing-body__rule--figma { height: 1mm; width: 22mm; margin: 4mm 0; }
      .prop-desc__body { font-size: 10.5pt; line-height: 1.65; color: #26282d; }

      /* The stats panel is white-on-navy on screen. Print it as a bordered
         table instead of a solid navy rectangle. */
      .aside-fl, .aside-fl--dark {
        background: #fff !important; border: 0.4mm solid #c5c6ce;
        margin-top: 8mm; padding: 5mm 6mm; page-break-inside: avoid;
      }
      .aside-fl--dark .aside-fl__h {
        color: #15243b !important; border-bottom-color: #c5c6ce !important;
      }
      .aside-fl--dark .aside-fl__row { border-bottom-color: #e4e2dd !important; }
      .aside-fl--dark .aside-fl__row__l { color: #44474d !important; }
      .aside-fl--dark .aside-fl__row__v { color: #15243b !important; }
      .aside-fl__stats { display: block !important; }

      /* Grant's note keeps its orange rule -- a border prints where a
         background does not. */
      .grant-note {
        background: #fff !important; border-left: 1mm solid #f7945b;
        page-break-inside: avoid; margin-top: 6mm; padding: 4mm 6mm;
      }
      .grant-note--empty { display: none !important; }
      .grant-note__body { font-size: 11pt; color: #15243b; }

      /* --- Features: the carousel becomes a plain three-across list --- */
      .section--features { padding: 0 !important; background: #fff !important; }
      .features-wrap { max-width: none !important; padding: 0 !important; }
      .features-h { font-size: 15pt; color: #15243b; margin: 9mm 0 4mm; }
      .features-viewport { overflow: visible !important; }
      .features-track {
        display: grid !important; grid-template-columns: 1fr 1fr;
        gap: 5mm !important; transform: none !important; width: auto !important;
      }
      .feat-card {
        width: auto !important; min-width: 0 !important; flex: none !important;
        /* The screen card is min-height 520px so all three stay level in the
           carousel. On paper that is three inches of blank card, so let each one
           shrink to its own rows. */
        min-height: 0 !important;
        border: 0.4mm solid #c5c6ce; padding: 4mm 5mm; background: #fff !important;
        page-break-inside: avoid;
      }
      .feat-card__h { font-size: 9pt; color: #15243b; }
      .feat-card__row { font-size: 9.5pt; }
      .feat-card__row__l { color: #44474d; }
      .feat-card__row__v { color: #15243b; }

      /* --- Closing line: who to call, and the URL this sheet came from --- */
      .print-foot {
        display: block; margin-top: 10mm; padding-top: 3mm;
        border-top: 0.4mm solid #c5c6ce;
        font-family: 'Manrope', sans-serif; font-size: 8.5pt; color: #44474d;
      }
      .print-foot__url { margin-top: 1.5mm; color: #75777e; word-break: break-all; }

      /* Never split a heading off from what follows it. */
      h1, h2, h3, .features-h, .listing-body__h--figma { page-break-after: avoid; }
      a { text-decoration: none !important; color: inherit !important; }
    }

    /* padding-top tracks .nav's own height at each breakpoint. That is 96px at
       desktop and 80px at BOTH mobile breakpoints -- responsive.css sets
       `height: 80px` at 1024px and again at 640px, it never goes to 64px. The
       64px here was reserving too little and let the fixed header sit 16px over
       the top of the hero on phones. Change both together if .nav ever changes. */
    @media (max-width: 1024px) {
      body { padding-top: 80px; }
      .back-bar { padding: 18px 24px; }
    }
    @media (max-width: 640px) {
      .back-bar { padding: 14px 20px; }
      .grant-note { padding: 20px; }
      .grant-note__body { font-size: 16px; }
      .prop-desc__body { font-size: 15px; }
    }
  </style>
</head>

      <a class="nav__drawer__link" href="/about/"><span>About</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></svg></a>

<script>
  /* Same behaviour as the layout's inline script. Standalone because this page is
     served as static HTML, not rendered through the Astro layout. */
  (function () {
    var burger = document.getElementById("navHamburger");
    var drawer = document.getElementById("navDrawer");
    if (!burger || !drawer) return;
    function setOpen(open) {
      burger.classList.toggle("is-open", open);
      drawer.classList.toggle("is-open", open);
      burger.setAttribute("aria-expanded", open ? "true" : "false");
      burger.setAttribute("aria-label", open ? "Close menu" : "Open menu");
      drawer.setAttribute("aria-hidden", open ? "false" : "true");
      document.body.style.overflow = open ? "hidden" : "";
    }
    burger.addEventListener("click", function () { setOpen(!drawer.classList.contains("is-open")); });
    drawer.querySelectorAll("[data-drawer-close]").forEach(function (el) {
      el.addEventListener("click", function () { setOpen(false); });
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && drawer.classList.contains("is-open")) setOpen(false);
    });
    window.addEventListener("resize", function () {
      if (window.innerWidth > 1024 && drawer.classList.contains("is-open")) setOpen(false);
    });
  })();
</script>

<div id="app">
  <div class="loading">
    <div class="loading__spinner"></div>
    <p>Loading listing details…</p>
  </div>
</div>

<!-- Lightbox, built on demand into this host -->
<div id="lbHost"></div>

<script>
const API = "";
let photos = [];
let lbIndex = 0;
let canEdit = false;
let currentSlug = "";
let featPage = 0;
let featCount = 0;

function fmt(price) { return price ? "$" + Number(price).toLocaleString() : "—"; }
function fmtSqft(n) { return n ? Number(n).toLocaleString() + " sq.ft." : "—"; }
function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function noteToHtml(s) { return escapeHtml(s).replace(/\n/g, "<br>"); }

/* ---------------- Contact form ---------------- */
async function submitListingInquiry(e) {
  e.preventDefault();
  const f = e.target;
  if (!f.checkValidity()) { f.reportValidity(); return false; }
  const btn = f.querySelector("button[type=submit]");
  const msg = document.getElementById("listingInquiryMsg");
  msg.textContent = "";
  btn.disabled = true;
  const label = btn.textContent;
  btn.textContent = "SENDING…";
  try {
    const payload = {};
    new FormData(f).forEach((v, k) => { payload[k] = v; });
    const r = await fetch("/api/contact", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.error || "Something went wrong. Please try again.");
    f.style.display = "none";
    msg.className = "form-sent";
    msg.style.display = "block";
    msg.textContent = "✓ Thanks — Grant will be in touch within 24 hours.";
  } catch (err) {
    msg.style.color = "#c0392b";
    msg.textContent = err.message;
    btn.disabled = false;
    btn.textContent = label;
  }
  return false;
}

/* ---------------- Owner note (admin inline edit) ---------------- */
function toggleNoteEdit() {
  const ed = document.getElementById("noteEditor");
  const btn = document.getElementById("noteEditBtn");
  if (!ed) return;
  const open = ed.style.display === "none";
  ed.style.display = open ? "block" : "none";
  if (btn) btn.style.display = open ? "none" : "inline-block";
}
async function saveNote() {
  const ta = document.getElementById("noteText");
  const status = document.getElementById("noteStatus");
  if (!ta) return;
  status.textContent = "Saving…";
  try {
    const r = await fetch("/api/listing-note", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ slug: currentSlug, note: ta.value }),
    });
    const data = await r.json();
    if (!r.ok || data.error) throw new Error(data.error || "Save failed");
    const body = document.getElementById("grantNoteBody");
    body.innerHTML = ta.value ? noteToHtml(ta.value) : "<em>No note yet — add a personal note about this property.</em>";
    document.getElementById("grantNote").classList.toggle("grant-note--empty", !ta.value);
    status.textContent = "Saved.";
    toggleNoteEdit();
    const btn = document.getElementById("noteEditBtn");
    if (btn) btn.textContent = ta.value ? "Edit note" : "Add note";
  } catch (e) {
    status.textContent = e.message;
  }
}

/* ---------------- Lightbox (.lb — styles live in styles.css) ---------------- */
function renderLightbox() {
  const host = document.getElementById("lbHost");
  if (lbIndex === null) { host.innerHTML = ""; document.body.style.overflow = ""; return; }
  const total = photos.length;
  host.innerHTML = `
    <div class="lb" onclick="closeLightbox()" role="dialog" aria-modal="true">
      <img class="lb__img" src="${photos[lbIndex]}" alt="Photo ${lbIndex + 1}" onclick="event.stopPropagation()" />
      <button class="lb__close" onclick="event.stopPropagation();closeLightbox()" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
      </button>
      <button class="lb__nav lb__nav--prev" onclick="event.stopPropagation();lbNav(-1)" aria-label="Previous">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></svg>
      </button>
      <button class="lb__nav lb__nav--next" onclick="event.stopPropagation();lbNav(1)" aria-label="Next">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></svg>
      </button>
      <div class="lb__counter">${String(lbIndex + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}</div>
    </div>`;
  document.body.style.overflow = "hidden";
}
function openLightbox(i) { lbIndex = i; renderLightbox(); }
function closeLightbox() { lbIndex = null; renderLightbox(); }
function lbNav(dir) {
  if (lbIndex === null || !photos.length) return;
  lbIndex = (lbIndex + dir + photos.length) % photos.length;
  renderLightbox();
}
document.addEventListener("keydown", e => {
  if (lbIndex === null) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") lbNav(-1);
  if (e.key === "ArrowRight") lbNav(1);
});

/* ---------------- Features carousel ----------------
   .features-viewport clips and .features-track translates, so the arrows are
   required — without them only the first three cards would ever be reachable.
   Transform matches the design's maths: 3 cards visible, 28px gap.            */
function featShift(dir) {
  const visible = window.innerWidth <= 640 ? 1 : (window.innerWidth <= 1024 ? 2 : 3);
  const maxPage = Math.max(0, featCount - visible);
  featPage = Math.min(maxPage, Math.max(0, featPage + dir));
  const track = document.getElementById("featTrack");
  if (track) track.style.transform = `translateX(calc(${-featPage} * (100% / ${visible}) - ${featPage} * 28px / ${visible}))`;
  const prev = document.getElementById("featPrev");
  const next = document.getElementById("featNext");
  if (prev) prev.disabled = featPage === 0;
  if (next) next.disabled = featPage >= maxPage;
}
window.addEventListener("resize", () => featShift(0));

          Listing data via Trestle (Cotality), courtesy of Incline Village Realtors&reg;. Information is deemed reliable but not guaranteed and should be independently verified.
        </span>
        <span>&copy; 2026 Grant C. Meyer Homes.</span>
      </div>
    </footer>
  `;

  document.title = `${listing.address} — Grant C. Meyer Homes`;
  featShift(0);
  syncSaved();

  // The print sheet's closing line carries the URL it came from, so a printed
  // page leads back to the live listing. Set here rather than in the template
  // because the template is a string built before anything is in the document.
  const pf = document.getElementById("printFootUrl");
  if (pf) pf.textContent = location.origin + location.pathname;
}

/* ---- Saved homes ----------------------------------------------------------
   The heart marks a home in this browser and nothing more: the slug goes into
   localStorage under gcm:saved, and syncSaved() restores the filled state when
   the page is opened again. There is no account behind it and no "saved homes"
   page to view the list on yet -- if that gets built, this is the key it reads.
   Wrapped in try/catch throughout: localStorage throws outright in Safari
   private mode rather than returning null. */
const SAVED_KEY = "gcm:saved";

function readSaved() {
  try {
    const raw = localStorage.getItem(SAVED_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  } catch (e) { return []; }
}

function syncSaved() {
  const btn = document.getElementById("saveBtn");
  if (!btn || !currentSlug) return;
  const on = readSaved().indexOf(currentSlug) > -1;
  btn.setAttribute("aria-pressed", on ? "true" : "false");
  btn.setAttribute("aria-label", on ? "Saved — click to remove" : "Save this home");
  btn.title = on ? "Saved" : "Save";
  // Fill the heart as well as colour it, so the state reads at a glance.
  const svg = btn.querySelector("svg");
  if (svg) {
    svg.setAttribute("fill", on ? "currentColor" : "none");
    btn.style.color = on ? "var(--orange)" : "";
  }
}

function toggleSaved() {
  if (!currentSlug) return;
  try {
    const list = readSaved();
    const i = list.indexOf(currentSlug);
    if (i > -1) list.splice(i, 1); else list.push(currentSlug);
    localStorage.setItem(SAVED_KEY, JSON.stringify(list));
  } catch (e) { /* private mode — the button still reflects nothing, honestly */ }
  syncSaved();
}

async function load() {
  // Support both the SEO URL (/homes/city/address) and legacy (?id=key). URLs are
  // canonically trailing-slashed, so strip it — the API resolves bare slugs.
  const slug = location.pathname.match(/^\/homes\/(.+?)\/?$/)?.[1];
  const legacyId = new URLSearchParams(location.search).get("id");

  if (!slug && !legacyId) { location.href = "/listings/"; return; }
  currentSlug = slug || "";

  const endpoint = slug
    ? `${API}/api/listing-by-slug/${slug}`
    : `${API}/listing/${legacyId}`;

  try {
    const resp = await fetch(endpoint);
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    canEdit = !!data.canEdit;
    render(data.listing, data.photos || [], data.marketIntel || null, data.area || null);
  } catch (e) {
    document.getElementById("app").innerHTML = `<div class="loading">Failed to load listing: ${escapeHtml(e.message)}</div>`;
  }
}

load();
</script>
