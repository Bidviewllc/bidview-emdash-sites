<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listing Detail — Grant C. Meyer Homes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=Noto+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

  <!-- The site design system. This page used to re-implement ~300 lines of it in an
       inline <style> block, which is why it drifted from the design. Everything the
       listing sections need — .listing-hero--fl, .aside-fl, .feat-card,
       .grant-intro, .invite, .lb — already lives in these two files. -->
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/responsive.css" />

  <style>
    /* Only what is genuinely specific to this page and NOT in styles.css. */

    /* --- Nav: none of it lives here any more. The header is .nav from styles.css
           and the drawer is .nav__drawer from responsive.css, the same as every
           other page. The old bar was position:sticky so the hero started beneath
           it; .nav is fixed, so body padding reserves that space instead — same
           result, and the photo still starts below the bar rather than under it.
           A bare `nav {}` rule must never come back here: the drawer's link list
           is a <nav> and it inherited the positioning last time. --- */
    body { padding-top: 96px; }

    /* --- "Back to all listings" bar. No design counterpart; kept because it is the
           way back for anyone arriving from the listings grid. --- */
    .back-bar { padding: 20px 48px; border-bottom: 1px solid var(--line); background: var(--cream); }
    .back-btn { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
    /* The arrow ships no width/height attributes. Without this it renders at the
       SVG default 300x150 and squeezes the label onto three lines. */
    .back-btn svg { width: 14px; height: 14px; flex: 0 0 auto; }
    .back-btn:hover { color: var(--navy); }

    /* --- "A Note From Grant" + its inline admin editor. Not part of the design, so
           not in styles.css. Public when a note exists; editable when logged in. --- */
    .grant-note {
      margin-top: 32px; padding: 24px 28px; background: var(--beige);
      border-left: 3px solid var(--orange); border-radius: 4px;
    }
    .grant-note--empty { background: #fff; border-left-color: var(--line); }
    /* Type from .eyebrow in styles.css; this owns the gap to the body. */
    .grant-note__label { margin-bottom: 10px; }
    .grant-note--empty .grant-note__label { color: var(--muted); }
    .grant-note__body { font-family: var(--font-serif); font-size: 18px; line-height: 1.7; color: var(--navy); }
    .grant-note__body em { color: var(--muted); font-size: 15px; }
    .grant-note__btn {
      margin-top: 14px; font-family: var(--font-sans); font-size: 12px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--navy);
      border: 1px solid var(--line); border-radius: 3px; padding: 8px 16px; background: #fff;
    }
    .grant-note__btn:hover { border-color: var(--navy); }
    .grant-note__btn--save { background: var(--navy); color: #fff; border-color: var(--navy); }
    .grant-note__editor { margin-top: 14px; }
    .grant-note__editor textarea {
      width: 100%; font-family: var(--font-sans); font-size: 15px; line-height: 1.6; color: var(--ink);
      border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; resize: vertical; background: #fff;
    }
    .grant-note__editor textarea:focus { outline: none; border-color: var(--orange); }
    .grant-note__actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .grant-note__status { font-family: var(--font-sans); font-size: 12px; }

    /* --- Rich-text property description (Portable Text from the CMS). --- */
    .prop-desc__body { font-size: 17px; line-height: 1.8; color: var(--body); }
    .prop-desc__body p { margin: 0 0 16px; }
    .prop-desc__body p:last-child { margin-bottom: 0; }
    .prop-desc__body h1, .prop-desc__body h2, .prop-desc__body h3, .prop-desc__body h4 { font-family: var(--font-serif); color: var(--navy); margin: 24px 0 12px; line-height: 1.25; }
    .prop-desc__body h3 { font-size: 22px; } .prop-desc__body h4 { font-size: 18px; }
    .prop-desc__body ul, .prop-desc__body ol { margin: 0 0 16px; padding-left: 22px; }
    .prop-desc__body li { margin: 4px 0; }
    .prop-desc__body blockquote { margin: 16px 0; padding: 8px 18px; border-left: 3px solid var(--orange); color: var(--navy); font-style: italic; }
    .prop-desc__body a { color: var(--orange); text-decoration: underline; }
    .prop-desc__flag { margin-top: 12px; font-family: var(--font-sans); font-size: 12px; font-weight: 600; color: var(--orange); }
    /* The "edited" pencil has no width/height attributes; unsized, it fills the column. */
    .prop-desc__flag > svg { width: 1.15em; height: 1.15em; vertical-align: -0.2em; margin-right: 2px; }

    /* --- .aside-fl__cta was authored for a <button>; used here as a link, which is
           inline by default, so it needs an explicit box. --- */
    a.aside-fl__cta { display: block; text-align: center; text-decoration: none; }

    /* --- Listing history (2026-11-09): a closed accordion under the Features &
           Amenities cards, same white card and type as .feat-card. --- */
    .lhist { width: 100%; background: var(--white); border: 1px solid rgba(197,198,206,0.45); }
    .lhist__sum {
      list-style: none; cursor: pointer; display: flex; align-items: center; gap: 16px;
      padding: 26px 36px; font-family: var(--font-noto); font-weight: 400; font-size: 26px; color: var(--navy);
    }
    .lhist__sum::-webkit-details-marker { display: none; }
    .lhist__sum:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
    .lhist__count {
      margin-left: auto; font-family: var(--font-sans); font-size: 11px; letter-spacing: 0.09em;
      text-transform: uppercase; color: var(--muted);
    }
    .lhist__chev { width: 20px; height: 20px; flex: none; color: var(--navy); transition: transform 200ms ease; }
    .lhist[open] .lhist__chev { transform: rotate(180deg); }
    .lhist__body { padding: 0 36px 30px; }
    .lhist__table { width: 100%; border-collapse: collapse; font-family: var(--font-sans); }
    .lhist__table th {
      text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--muted); padding: 0 12px 10px 0; border-bottom: 1px solid #E5E7EB;
    }
    .lhist__table td {
      font-size: 14px; color: var(--ink); padding: 13px 12px 13px 0; vertical-align: top;
      border-bottom: 1px solid rgba(197,198,206,0.25);
    }
    .lhist__table tr:last-child td { border-bottom: none; }
    .lhist__table th:last-child, .lhist__table td:last-child { text-align: right; padding-right: 0; white-space: nowrap; }
    .lhist__table td:first-child { white-space: nowrap; color: var(--body); }
    .lhist__chg { display: block; font-size: 12px; color: var(--body); }
    .lhist__row--admin td { color: var(--muted); }
    .lhist__tag {
      display: inline-block; margin-left: 6px; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--navy); background: rgba(247,148,91,0.25); padding: 2px 6px; border-radius: 2px;
    }
    .lhist__note { margin-top: 16px; font-family: var(--font-sans); font-size: 12px; line-height: 1.5; color: var(--body); }
    .listing-hero__status--off { background: rgba(255,255,255,0.92); color: var(--muted); }
    /* Admin-only notice when Grant's content is switched off for this home. */
    .grant-off { margin: 0 0 24px; padding: 14px 18px; border: 1px dashed rgba(168,74,22,0.6); background: rgba(247,148,91,0.12); font-family: var(--font-sans); font-size: 13px; line-height: 1.5; color: var(--ink); }
    .grant-off a { color: #a84a16; font-weight: 600; }
    @media (max-width: 640px) {
      .lhist__sum { padding: 20px 20px; font-size: 22px; }
      .lhist__body { padding: 0 20px 22px; }
      .lhist__table td { font-size: 13px; }
    }

    /* --- Quick Statistics: dark panel, design typography. ONLY colours are
           overridden here. Every size, weight, letter-spacing and gap still comes
           from .aside-fl in styles.css, so the type now matches the design while
           the panel stays dark. --- */
    .aside-fl--dark { background: var(--navy); }
    .aside-fl--dark .aside-fl__h {
      color: rgba(255, 255, 255, 0.55);
      border-bottom-color: rgba(255, 255, 255, 0.14);
    }
    .aside-fl--dark .aside-fl__row { border-bottom-color: rgba(255, 255, 255, 0.10); }
    .aside-fl--dark .aside-fl__row__l { color: rgba(255, 255, 255, 0.62); }
    .aside-fl--dark .aside-fl__row__v { color: var(--white); }

    /* --- Listing brokerage + MLS facts (compliance, 2026-11-06). IDX rules want
           the listing brokerage in a readable size and colour, so these sit at
           near-full white on the navy panel rather than the faint label grey. --- */
    .listing-info {
      margin-top: 4px; padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      display: flex; flex-direction: column; gap: 8px;
      font-family: var(--font-sans); font-size: 13px; line-height: 1.5;
      color: rgba(255, 255, 255, 0.9);
    }
    .listing-info__l {
      display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
    }
    /* Features & Amenities as a grid (2026-11-09, Liz; was a carousel): all four cards
       on screen at once, no arrows. 4 across on a wide screen, 2 x 2 on a tablet,
       one column on a phone. Screen only: print has its own two-column rule. */
    @media screen {
      .features-viewport--grid { overflow: visible; padding: 0; }
      .features-track--grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
      .features-track--grid .feat-card { flex: none; min-height: 0; padding: 32px 26px; }
      .features-track--grid .feat-card__h { font-size: 23px; margin-bottom: 18px; }
    }
    @media screen and (max-width: 1200px) {
      .features-track--grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media screen and (max-width: 640px) {
      .features-track--grid { grid-template-columns: 1fr; gap: 16px; }
    }
    /* Hero tags + credit (2026-11-09, Liz). Under the address: one orange block
       reading "Neighborhood: <name>" (plus Grant's side on a sold home, as its
       own block). The "Listing courtesy of" line sits under the stats. */
    .listing-hero__tags { order: 2; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .listing-hero--fl .listing-hero__tags .listing-hero__crumb { margin: 0; }
    .listing-hero__right { display: flex; flex-direction: column; align-items: flex-start; }
    .listing-hero--fl .listing-hero__right .listing-hero__stats { padding-bottom: 12px; }
    .listing-hero__right .listing-hero__credit { margin-top: 0; max-width: 46ch; }
    /* Under the hero stats; the hero veil keeps white text legible. */
    .listing-hero__credit {
      order: 3; margin-top: 10px;
      font-family: var(--font-sans); font-size: 14px; line-height: 1.4;
      color: var(--white); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
    }

    /* --- Floor plan jump link, under Quick Statistics. Outline rather than
           orange so "Schedule a private tour" stays the one primary action. --- */
    a.aside-fl__fp {
      display: block; text-align: center; text-decoration: none;
      font-family: var(--font-sans); font-weight: 600; font-size: 12px;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--white);
      padding: 18px 20px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.35);
      transition: border-color 180ms ease, background 180ms ease;
    }
    a.aside-fl__fp:hover { border-color: var(--orange); background: rgba(247, 148, 91, 0.12); }

    @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
    /* Clears the fixed .nav when the jump link lands. */
    #propGallery { scroll-margin-top: 120px; }
    #floor-plans, #tour { scroll-margin-top: 24px; }

    /* --- Property gallery: a mosaic in the description column. Tiles follow a
           12-photo cycle (big, four small, two wide, four small around a big one
           on the right) that fills its rows exactly, so "Load more" appends whole
           cycles with no holes. Only the final partial cycle gets its own fill
           pattern (see galleryTileClass). Row height is tied to the column width
           through container units, so tiles keep a landscape shape at any size. --- */
    .pgallery { margin-top: 64px; container-type: inline-size; }
    .pgallery__head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .pgallery__h { font-family: var(--font-noto); font-weight: 400; font-size: 28px; color: var(--navy); line-height: 1.2; }
    .pgallery__grid {
      --gap: 8px;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap);
      grid-auto-rows: calc((100cqw - 3 * var(--gap)) / 4 * 0.75);
    }
    .pgallery__tile {
      position: relative; overflow: hidden; border-radius: 4px; padding: 0;
      border: 0; background: var(--beige); cursor: zoom-in; display: block;
    }
    .pgallery__tile img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 500ms cubic-bezier(0.22, 0.7, 0.2, 1);
    }
    .pgallery__tile:hover img { transform: scale(1.04); }
    .pgallery__tile:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
    .pgallery__tile--big { grid-column: span 2; grid-row: span 2; }
    .pgallery__tile--right { grid-column: 3 / span 2; grid-row: span 2; }
    .pgallery__tile--wide { grid-column: span 2; }
    .pgallery__tile--full { grid-column: 1 / -1; grid-row: span 2; }
    .pgallery__foot { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 28px; flex-wrap: wrap; }
    .pgallery__count { font-family: var(--font-sans); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .pgallery__more {
      font-family: var(--font-sans); font-weight: 600; font-size: 12px; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--navy); background: transparent;
      border: 1px solid var(--navy); border-radius: 6px; padding: 16px 32px; cursor: pointer;
      transition: background 180ms ease, color 180ms ease;
    }
    .pgallery__more:hover { background: var(--navy); color: var(--white); }
    .pgallery__more[hidden] { display: none; }

    /* --- Lightbox. The .lb shell is built once per open and only the <img>
           source changes between photos, so neither the backdrop fade nor the
           zoom-in in styles.css replays on every arrow press -- replaying them is
           what flashed the page through. The next photo is decoded before it is
           swapped in; until then the current one dims slightly. --- */
    .lb__img { transition: opacity 160ms ease; }
    .lb__img.is-loading { opacity: 0.6; }
    .lb__img.is-plan { background: #fff; padding: 16px; border-radius: 4px; }

    /* --- Note From Grant media: image, one video or several, from the admin. --- */
    /* One item fills the column; with more, the first runs full width and the
       rest sit two to a row under it (a lone last one spans the row), so three
       or four videos don't stack into a column far taller than the note. */
    .note-media { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .note-media > :first-child, .note-media > :last-child:nth-child(even) { grid-column: 1 / -1; }
    .note-media .local-card__photo { height: auto; aspect-ratio: 16 / 9; }
    .note-media__video {
      position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden;
      background: var(--navy); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
    .note-media__video iframe, .note-media__video video {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; object-fit: cover;
    }
    .grant-note__more { margin-top: 12px; font-family: var(--font-sans); font-size: 12px; font-weight: 600; }
    .grant-note__more a { color: var(--orange); }

    /* --- Interactive floor plan: full width, the same frame as the 3D tour. --- */
    /* The 3D tour and the floor plan sit in full-width bands, navy then beige,
       so they read as their own sections against the cream page. */
    .tour-band { background: var(--navy); padding: 96px 0; }
    /* The card is navy too; a faint edge keeps it from melting into the band
       when a listing has no photo to put behind it. */
    .tour-band .matterport { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12); }
    .matterport:focus-visible { outline: 2px solid var(--orange); outline-offset: 4px; }
    /* Once launched, the card holds the tour itself at the same size. */
    .matterport.is-playing { cursor: default; transform: none; background: #000; }
    .matterport.is-playing iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    .floorplan { background: var(--beige); padding: 96px 0; }
    /* --- Location map: a Google Maps embed, the same keyless iframe Vince uses on
           the other Bidview sites. Lazy-loaded by the browser. --- */
    .listing-map { background: var(--white); padding: 96px 0; }
    .listing-map__head {
      max-width: 1320px; margin: 0 auto 28px; padding: 0 32px;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap;
    }
    .listing-map__frame {
      margin: 0 max(32px, calc((100% - 1256px) / 2)); height: min(60vh, 520px); min-height: 360px;
      border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--beige-2);
    }
    .listing-map__map { display: block; width: 100%; height: 100%; border: 0; }
    .listing-map__area { max-width: 1320px; margin: 18px auto 0; padding: 0 32px; font-family: var(--font-sans); font-size: 15px; color: var(--navy); }
    .listing-map__area a { color: var(--orange); }
    .floorplan__head {
      max-width: 1320px; margin: 0 auto 28px; padding: 0 32px;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap;
    }
    .floorplan__h { font-family: var(--font-noto); font-weight: 400; font-size: 34px; line-height: 1.2; color: var(--navy); margin-top: 8px; }
    .floorplan__open { font-family: var(--font-sans); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--navy); display: inline-flex; align-items: center; gap: 8px; }
    .floorplan__open:hover { color: var(--orange); }
    button.floorplan__open { background: none; border: 0; padding: 0; cursor: pointer; }
    .floorplan__open[hidden] { display: none; }
    .floorplan__tabs { max-width: 1320px; margin: -8px auto 20px; padding: 0 32px; display: flex; flex-wrap: wrap; gap: 8px; }
    .floorplan__tab {
      font-family: var(--font-sans); font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--navy); background: transparent; border: 1px solid var(--line); border-radius: 999px;
      padding: 10px 18px; cursor: pointer; transition: border-color 150ms ease, background 150ms ease, color 150ms ease;
    }
    .floorplan__tab:hover { border-color: var(--navy); }
    .floorplan__tab[aria-selected="true"] { background: var(--navy); border-color: var(--navy); color: var(--white); }
    .floorplan__frame {
      margin: 0 max(32px, calc((100% - 1256px) / 2)); border-radius: 8px; overflow: hidden; background: var(--white);
      border: 1px solid var(--line); height: min(82vh, 820px); min-height: 480px;
    }
    /* Image plans: one fixed 4:3 frame for every tab (DX plans are 4000x3000),
       so moving between plans never shrinks the section and regrows it while
       the next image loads. Other shapes letterbox inside it. */
    /* A fixed height (not aspect-ratio: with a max-height that shrinks the frame's
       width and leaves it hanging left). 3/4 of the frame width suits 4:3 plans. */
    .floorplan__frame.is-image { min-height: 0; height: min(82vh, 820px, calc((min(100vw, 1320px) - 64px) * 0.75)); }
    .floorplan__panel--image { position: relative; }
    .floorplan__panel--image .floorplan__img { height: 100%; }
    .floorplan__zoomhint {
      position: absolute; right: 16px; bottom: 16px; pointer-events: none;
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
      background: rgba(20, 33, 61, 0.86); color: var(--white);
      font-family: var(--font-sans); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    }
    /* Self-sizing embed: the frame follows the iframe, which the plan page
       resizes; 640px is only what shows until it reports in. */
    /* These plans also draw their own frame, so ours would make a box in a box. */
    .floorplan__frame.is-auto { height: auto; min-height: 0; border-color: transparent; background: transparent; }
    .floorplan__frame.is-auto iframe { height: 640px; }
    .floorplan__panel { height: 100%; }
    .floorplan__panel[hidden] { display: none; }
    .floorplan__frame iframe { width: 100%; height: 100%; border: 0; display: block; }
    .floorplan__img { display: block; width: 100%; padding: 24px; background: none; border: 0; cursor: zoom-in; }
    .floorplan__img img { display: block; width: 100%; height: 100%; object-fit: contain; margin: 0 auto; }

    /* --- Zoom in the full-screen viewer (photos and floor plans). The image is
           moved with a transform, so the layout never changes while zooming. --- */
    .lb { overflow: hidden; touch-action: none; }
    .lb__img { cursor: zoom-in; user-select: none; -webkit-user-drag: none; }
    /* The open animation animates transform too; once zoomed, ours must win. */
    .lb__img.is-zoomed { cursor: grab; animation: none; }
    .lb__img.is-dragging { cursor: grabbing; }
    .lb__img.is-easing { transition: opacity 160ms ease, transform 200ms ease; }
    .lb__zoom {
      position: absolute; right: 32px; bottom: 26px; display: flex; gap: 8px; z-index: 2;
    }
    .lb__zoom button {
      width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); color: var(--white);
      cursor: pointer; backdrop-filter: blur(6px); transition: background 180ms ease;
    }
    .lb__zoom button:hover { background: rgba(255,255,255,0.2); }
    .lb__zoom button:disabled { opacity: 0.35; cursor: default; }
    .lb__hint {
      position: absolute; left: 50%; top: 32px; transform: translateX(-50%); pointer-events: none;
      color: rgba(255,255,255,0.75); font-family: var(--font-sans); font-size: 12px; letter-spacing: 0.06em;
      transition: opacity 400ms ease;
    }
    .lb__hint.is-gone { opacity: 0; }
    @media (max-width: 640px) {
      .lb__zoom { right: 16px; bottom: 16px; }
      .lb__zoom button { width: 40px; height: 40px; }
    }
    .lb__nav[hidden] { display: none; }

    /* --- Loading state --- */
    .loading { text-align: center; padding: 220px 40px; color: var(--muted); }
    .loading__spinner { width: 40px; height: 40px; border: 3px solid var(--line); border-top-color: var(--navy); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ======================================================================
       PRINT — a two-page property sheet, not a screenshot of the web page
       ======================================================================
       The printer button (window.print()) used to hand over the page as-is:
       an 800px photo hero with white text on a background image the printer
       drops, then the filmstrip, the 3D-tour panel, the horizontally-scrolled
       features carousel (only the first card visible), the guide portrait, the
       market card and the whole inquiry form and footer.

       What prints now: a header sheet with the primary photo, address and the
       headline numbers; the description; Quick Statistics; every feature card
       as a plain list (no carousel); and Grant's note if there is one. That is
       the set a buyer or an agent actually wants on paper.

       Two things drive most of the rules below:
       - Browsers omit CSS background-images from print by default, so anything
         that is a background on screen either gets a real <img> for print
         (.print-sheet__img) or is hidden. Nothing relies on the reader having
         turned "background graphics" on.
       - Colour is inverted where the screen uses white-on-navy, so the ink is
         dark on white rather than a solid navy block. */
    .print-sheet, .print-foot, .print-extras { display: none; }
    /* The print-only table wrapper must not behave like a table on screen. */
    .print-doc, .print-doc__body,
    .print-doc > tbody > tr, .print-doc > tbody > tr > td { display: block; }
    .print-doc { width: 100%; border-collapse: collapse; }

    @media print {
      @page { size: letter portrait; margin: 14mm; }

      /* Back to a real table so the <tfoot> repeats -- see the note where
         the markup is generated. */
      .print-doc { display: table; width: 100%; table-layout: fixed; }
      .print-doc__body { display: table-row-group; }
      .print-doc > tbody > tr, .print-doc > tfoot > tr { display: table-row; }
      .print-doc > tbody > tr > td, .print-doc > tfoot > tr > td {
        display: table-cell; padding: 0; vertical-align: top;
      }

      html, body { background: #fff !important; padding-top: 0 !important; }
      body { font-size: 11pt; color: #000; }

      /* --- Everything that is navigation, marketing or interactive --- */
      .nav, .nav__drawer, .nav__scrim, .back-bar, .footer,
      .listing-hero, .pgallery, .floorplan, .listing-map, .section--features .features-nav,
      .tour-band, .section--market, .section--community, .section--grant-intro,
      #listing-contact, .lightbox, .listing-hero__share,
      .grant-note__btn, .grant-note__editor, .grant-note__status,
      .prop-desc__flag, .aside-fl__cta, .cta-arrow, .lhist {
        display: none !important;
      }

      /* --- The print-only header sheet --- */
      .print-sheet { display: block; page-break-after: avoid; }
      .print-sheet__img {
        /* 78mm pushed the condensed stats onto page two and left the foot of
           page one blank. */
        width: 100%; height: 64mm; object-fit: cover;
        border-radius: 2mm; margin-bottom: 5mm;
      }
      .print-sheet__head {
        display: flex; align-items: center; justify-content: space-between;
        gap: 8mm; padding-bottom: 3mm; border-bottom: 0.4mm solid #c5c6ce;
      }
      .print-sheet__logo { height: 16mm; width: auto; }
      .print-sheet__crumb {
        font-family: 'Manrope', sans-serif; font-size: 8pt; letter-spacing: 0.18em;
        text-transform: uppercase; color: #44474d; text-align: right;
      }
      .print-sheet__addr {
        font-family: 'Noto Serif', Georgia, serif; font-weight: 400;
        font-size: 24pt; line-height: 1.12; color: #15243b; margin: 5mm 0 3mm;
      }
      .print-sheet__facts {
        display: flex; align-items: baseline; gap: 6mm; flex-wrap: wrap;
        font-family: 'Manrope', sans-serif; font-size: 10pt; font-weight: 600;
        letter-spacing: 0.1em; color: #44474d;
      }
      .print-sheet__price {
        font-family: 'Noto Serif', Georgia, serif; font-size: 16pt;
        font-weight: 400; letter-spacing: 0; color: #15243b; margin-left: auto;
      }
      .print-sheet__credit {
        font-family: 'Manrope', sans-serif; font-size: 9pt; color: #44474d; margin-top: 2mm;
      }

      /* --- Condensed stats + Grant's note, side by side --- */
      .print-extras { display: block; }
      .print-cols {
        display: grid; grid-template-columns: 1fr 1fr; gap: 6mm;
        margin-top: 7mm; page-break-inside: avoid;
      }
      /* With no note there is nothing to sit beside, so the stats run the full
         measure in two columns instead of leaving half the page blank. */
      .print-cols--solo { grid-template-columns: 1fr; }
      .print-cols--solo .print-stats__list {
        display: grid; grid-template-columns: 1fr 1fr; column-gap: 8mm;
      }

      .print-stats, .print-note {
        border: 0.4mm solid #c5c6ce; padding: 4mm 5mm; page-break-inside: avoid;
      }
      .print-stats__h, .print-note__h {
        font-family: 'Manrope', sans-serif; font-size: 8pt; font-weight: 700;
        letter-spacing: 0.16em; text-transform: uppercase; color: #15243b;
        padding-bottom: 2mm; margin-bottom: 2mm; border-bottom: 0.3mm solid #c5c6ce;
      }
      .print-stats__list { margin: 0; }
      .print-stats__row {
        display: flex; justify-content: space-between; gap: 4mm;
        padding: 1.1mm 0; border-bottom: 0.2mm solid #eceae6;
        break-inside: avoid;
      }
      .print-stats__row:last-child { border-bottom: none; }
      .print-stats__row dt {
        font-family: 'Manrope', sans-serif; font-size: 8pt; color: #44474d;
      }
      .print-stats__row dd {
        margin: 0; font-family: 'Manrope', sans-serif; font-size: 8pt;
        font-weight: 600; color: #15243b; text-align: right;
      }
      .print-note { border-left: 1mm solid #f7945b; }
      .print-note__body {
        font-family: 'Source Serif 4', Georgia, serif; font-size: 9.5pt;
        line-height: 1.55; color: #15243b;
      }
      .print-note__body p { margin: 0 0 2mm; }
      .print-note__attr {
        font-family: 'Manrope', sans-serif; font-size: 7pt; font-weight: 700;
        letter-spacing: 0.14em; color: #f7945b; margin-top: 2.5mm;
      }

      /* --- Description; the screen's own stats aside and note band are
             replaced by .print-extras above --- */
      .aside-fl, .aside-fl--dark, .section--local, .grant-note { display: none !important; }
      .listing-body { padding: 0 !important; background: #fff !important; }
      .listing-body__grid { display: block !important; }
      .listing-body__h--figma { font-size: 15pt; margin-top: 8mm; }
      .listing-body__rule--figma { height: 1mm; width: 22mm; margin: 4mm 0; }
      .prop-desc__body { font-size: 10.5pt; line-height: 1.65; color: #26282d; }

      /* --- Features: the carousel becomes a plain three-across list --- */
      .section--features { padding: 0 !important; background: #fff !important; }
      .features-wrap {
        max-width: none !important; padding: 0 !important;
        gap: 3mm !important;
      }
      .features-h { font-size: 14pt; color: #15243b; margin: 6mm 0 0; }
      .features-viewport { overflow: visible !important; }
      .features-track {
        display: grid !important; grid-template-columns: 1fr 1fr;
        gap: 5mm !important; transform: none !important; width: auto !important;
      }
      .feat-card {
        width: auto !important; min-width: 0 !important; flex: none !important;
        /* The screen card is min-height 520px so all three stay level in the
           carousel. On paper that is three inches of blank card, so let each one
           shrink to its own rows. */
        min-height: 0 !important;
        border: 0.4mm solid #c5c6ce; padding: 4mm 5mm; background: #fff !important;
        page-break-inside: avoid;
      }
      /* The screen metrics (26px heading, 28px bottom margin, 12px row
         padding) spilled two of the four cards onto a third, near-empty page. */
      .feat-card__h {
        font-size: 9pt; color: #15243b;
        padding-bottom: 1.5mm; margin-bottom: 2mm;
        border-bottom-color: #e5e7eb;
      }
      .feat-card__row { font-size: 9pt; padding: 1.1mm 0; gap: 4mm; }
      .feat-card__row__l { color: #44474d; }
      .feat-card__row__v { color: #15243b; }

      /* --- Footer, on every printed page ---
             position: fixed repeats an element on each page of print output, and
             @page's bottom margin is sized to reserve room for it so no content
             runs underneath. The logo file is the site's white one; brightness(0)
             flattens it to black while keeping its transparency, the same trick
             styles.css already uses in reverse for the transparent nav. */
      /* Repeated at the bottom of every printed page, with its height
         reserved in the flow so it never covers content. `position: fixed`
         repeats too but reserves nothing -- it painted over the stats block --
         and pushing it into the @page margin got it clipped away entirely.
         A footer group is laid out as a row group, so the flex row lives on
         .print-foot__inner rather than here. */
      .print-foot {
        display: table-footer-group;
        font-family: 'Manrope', sans-serif; font-size: 8.5pt; color: #44474d;
      }
      /* Every page gets the footer, so the rule above it should not also carry
         a big top margin on the pages where content runs right up to it. */
      .print-doc > tfoot .print-foot__inner { margin-top: 4mm; }
      .print-foot__inner {
        display: flex; align-items: center; gap: 7mm;
        padding-top: 2.5mm; margin-top: 6mm;
        border-top: 0.4mm solid #c5c6ce;
      }
      .print-foot__mid { flex: 1 1 auto; min-width: 0; }
      .print-foot__cta {
        font-family: 'Source Serif 4', Georgia, serif; font-size: 11pt;
        color: #15243b; line-height: 1.25;
      }
      .print-foot__who { font-size: 7.5pt; color: #75777e; margin-top: 1mm; }
      .print-foot__contact { text-align: right; flex: 0 0 auto; }
      .print-foot__phone {
        font-family: 'Noto Serif', Georgia, serif; font-size: 13pt; color: #15243b;
      }
      .print-foot__site { font-size: 9.5pt; font-weight: 600; color: #15243b; margin-top: 0.8mm; }

      /* Never split a heading off from what follows it. */
      h1, h2, h3, .features-h, .listing-body__h--figma { page-break-after: avoid; }
      a { text-decoration: none !important; color: inherit !important; }
    }

    /* padding-top tracks .nav's own height at each breakpoint. That is 96px at
       desktop and 80px at BOTH mobile breakpoints -- responsive.css sets
       `height: 80px` at 1024px and again at 640px, it never goes to 64px. The
       64px here was reserving too little and let the fixed header sit 16px over
       the top of the hero on phones. Change both together if .nav ever changes. */
    @media (max-width: 1024px) {
      body { padding-top: 80px; }
      .back-bar { padding: 18px 24px; }
      #propGallery { scroll-margin-top: 100px; }
      #floor-plans, #tour { scroll-margin-top: 36px; }
      .floorplan__head { padding: 0 24px; }
      .floorplan__frame { margin: 0 24px; }
      .listing-map__head, .listing-map__area { padding: 0 24px; }
      .listing-map__frame { margin: 0 24px; }
      .floorplan__tabs { padding: 0 24px; }
      .floorplan__h { font-size: 28px; }
      /* Media above the copy once the card stacks, as .local-card__photo does. */
      .note-media { order: -1; }
      .note-media .local-card__photo { order: 0; }
    }
    @media (max-width: 640px) {
      .back-bar { padding: 14px 20px; }
      .pgallery { margin-top: 48px; }
      .pgallery__h { font-size: 24px; }
      /* Two columns: every span-2 tile becomes a full row, so the cycle still
         fills its rows exactly. */
      .pgallery__grid { --gap: 6px; grid-template-columns: repeat(2, 1fr); grid-auto-rows: calc((100cqw - var(--gap)) / 2 * 0.75); }
      .pgallery__tile--right { grid-column: span 2; }
      .floorplan, .tour-band, .listing-map { padding: 64px 0; }
      .floorplan__head { padding: 0 20px; }
      .floorplan__frame { margin: 0 20px; height: 70vh; min-height: 420px; }
      .listing-map__head, .listing-map__area { padding: 0 20px; }
      .listing-map__frame { margin: 0 20px; height: 360px; min-height: 0; }
      .floorplan__frame.is-image { height: calc((100vw - 40px) * 0.75); min-height: 0; }
      .floorplan__frame.is-auto { height: auto; min-height: 0; }
      .floorplan__tabs { padding: 0 20px; }
      .floorplan__img { padding: 12px; }
      .floorplan__h { font-size: 24px; }
      .grant-note { padding: 20px; }
      .grant-note__body { font-size: 16px; }
      .prop-desc__body { font-size: 15px; }
    }
  </style>
</head>

<script>
  /* Same behaviour as the layout's inline script. Standalone because this page is
     served as static HTML, not rendered through the Astro layout. */
  (function () {
    var burger = document.getElementById("navHamburger");
    var drawer = document.getElementById("navDrawer");
    if (!burger || !drawer) return;
    function setOpen(open) {
      burger.classList.toggle("is-open", open);
      drawer.classList.toggle("is-open", open);
      burger.setAttribute("aria-expanded", open ? "true" : "false");
      burger.setAttribute("aria-label", open ? "Close menu" : "Open menu");
      drawer.setAttribute("aria-hidden", open ? "false" : "true");
      document.body.style.overflow = open ? "hidden" : "";
    }
    burger.addEventListener("click", function () { setOpen(!drawer.classList.contains("is-open")); });
    drawer.querySelectorAll("[data-drawer-close]").forEach(function (el) {
      el.addEventListener("click", function () { setOpen(false); });
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && drawer.classList.contains("is-open")) setOpen(false);
    });
    window.addEventListener("resize", function () {
      if (window.innerWidth > 1024 && drawer.classList.contains("is-open")) setOpen(false);
    });
  })();
</script>

<div id="app">
  <div class="loading">

  </div>

<!-- Lightbox, built on demand into this host -->
