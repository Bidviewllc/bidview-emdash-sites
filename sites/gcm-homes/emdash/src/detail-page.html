<script>
const API = "";
let photos = [];
let fpImages = [];
let fpNames = [];
let fpAutoHeight = false;
let lbIndex = 0;
let canEdit = false;
let currentSlug = "";

function fmt(price) { return price ? "$" + Number(price).toLocaleString() : "—"; }
function fmtSqft(n) { return n ? Number(n).toLocaleString() + " sq.ft." : "—"; }
// "2026-09-17" -> "September 2026". Close dates are date-only, so anchor to UTC
// or the day before can slip through in US time zones.
function fmtDate(d) {
  if (!d) return "—";
  const t = Date.parse(String(d).length <= 10 ? `${d}T00:00:00Z` : d);
  return Number.isNaN(t) ? "—" : new Date(t).toLocaleDateString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });
}
// "2026-11-06T14:02:11Z" -> "Nov 6, 2026", for the "last updated" line.
// A date-only value ("2026-08-28") is a calendar day, so it is read and shown in
// UTC; read as UTC midnight but shown in US time it printed the day before.
function fmtDay(d) {
  if (!d) return null;
  const dateOnly = String(d).length <= 10;
  const t = Date.parse(dateOnly ? `${d}T00:00:00Z` : d);
  return Number.isNaN(t) ? null : new Date(t).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", ...(dateOnly ? { timeZone: "UTC" } : {}) });
}
function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
// "Total Days on Market" (cumulative across relists) only earns a row when the
// property has actually been relisted -- otherwise it just repeats the number
// directly above it. The 2-day margin is because the two figures come from
// different anchors: see liveDom / liveCumDom in src/lib/listings.ts.
function totalDomRows(listing) {
  const cur = listing.daysOnMarket, tot = listing.cumulativeDaysOnMarket;
  return (tot != null && cur != null && tot - cur >= 2) ? [["Total Days on Market", tot]] : [];
}
// MLS enum fields arrive machine-shaped: single values are PascalCase
// ("SingleFamilyResidence") and multi-value fields are comma-joined with no
// space after the comma ("Lake,Mountains"). Both read as raw data on the page,
// so split them back into words. Only ever used on enum fields -- never on
// formatted numbers, where splitting on commas would wreck the thousands
// separators.
function fmtEnum(v) {
  if (v == null || v === "") return "";
  return String(v)
    .split(",")
    .map(t => t.trim())
    .filter(Boolean)
    .map(t => t
      .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
      .replace(/([A-Z]+)([A-Z][a-z])/g, "$1 $2")
      .replace(/ +/g, " ")
      .trim())
    .join(", ");
}
function noteToHtml(s) { return escapeHtml(s).replace(/\n/g, "<br>"); }

/* ---------------- Contact form ---------------- */
async function submitListingInquiry(e) {
  e.preventDefault();
  const f = e.target;
  if (!f.checkValidity()) { f.reportValidity(); return false; }
  const btn = f.querySelector("button[type=submit]");
  const msg = document.getElementById("listingInquiryMsg");
  msg.textContent = "";
  btn.disabled = true;
  const label = btn.textContent;
  btn.textContent = "SENDING…";
  try {
    const payload = {};
    new FormData(f).forEach((v, k) => { payload[k] = v; });
    const r = await fetch("/api/contact", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.error || "Something went wrong. Please try again.");
    f.style.display = "none";
    msg.className = "form-sent";
    msg.style.display = "block";
    msg.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12" /></svg> Thanks. One of the team will call, text, or write back as soon as we possibly can.';
  } catch (err) {
    msg.style.color = "#c0392b";
    msg.textContent = err.message;
    btn.disabled = false;
    btn.textContent = label;
  }
  return false;
}

/* ---------------- Owner note (admin inline edit) ---------------- */
function toggleNoteEdit() {
  const ed = document.getElementById("noteEditor");
  const btn = document.getElementById("noteEditBtn");
  if (!ed) return;
  const open = ed.style.display === "none";
  ed.style.display = open ? "block" : "none";
  if (btn) btn.style.display = open ? "none" : "inline-block";
}
async function saveNote() {
  const ta = document.getElementById("noteText");
  const status = document.getElementById("noteStatus");
  if (!ta) return;
  status.textContent = "Saving…";
  try {
    const r = await fetch("/api/listing-note", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ slug: currentSlug, note: ta.value }),
    });
    const data = await r.json();
    if (!r.ok || data.error) throw new Error(data.error || "Save failed");
    const body = document.getElementById("grantNoteBody");
    body.innerHTML = ta.value ? noteToHtml(ta.value) : "<em>No note yet — add a personal note about this property.</em>";
    document.getElementById("grantNote").classList.toggle("grant-note--empty", !ta.value);
    status.textContent = "Saved.";
    toggleNoteEdit();
    const btn = document.getElementById("noteEditBtn");
    if (btn) btn.textContent = ta.value ? "Edit note" : "Add note";
  } catch (e) {
    status.textContent = e.message;
  }
}

/* ---------------- Lightbox (.lb — styles live in styles.css) ----------------
   The shell is built once when the lightbox opens; moving between photos only
   swaps the <img> source. It used to rebuild the whole thing on every arrow
   press, which replayed the open animations from transparent and flashed the
   page through between photos. The next photo is decoded off-screen first and
   swapped in once it is ready, and its neighbours are fetched ahead, so the
   frame never goes blank. */
const lbCache = new Map();
let lbToken = 0;
// What the lightbox is paging through: the listing photos, or the floor plan
// images (which carry names and sit on white, since plans are often
// transparent PNGs that would vanish on the dark backdrop).
let lbList = [];
let lbNames = null;
function lbPreload(i) {
  const src = lbList[(i + lbList.length) % lbList.length];
  if (!src) return null;
  let img = lbCache.get(src);
  if (!img) { img = new Image(); img.decoding = "async"; img.src = src; lbCache.set(src, img); }
  return img;
}
function buildLightbox() {
  const host = document.getElementById("lbHost");
  host.innerHTML = `
    <div class="lb" onclick="lbBackdropClick()" role="dialog" aria-modal="true" aria-label="Photo gallery">
      <img class="lb__img" id="lbImg" alt="" draggable="false" onclick="event.stopPropagation()" />
      <div class="lb__hint" id="lbHint">Scroll, pinch or click to zoom · drag to move around</div>
      <div class="lb__zoom" onclick="event.stopPropagation()">
        <button type="button" id="lbZoomOut" onclick="lbZoomStep(-1)" aria-label="Zoom out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12" /></svg>
        </button>
        <button type="button" id="lbZoomIn" onclick="lbZoomStep(1)" aria-label="Zoom in">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>
        </button>
        <button type="button" id="lbZoomReset" onclick="lbZoomReset(true)" aria-label="Fit to screen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 9 4 4 9 4" /><polyline points="20 9 20 4 15 4" /><polyline points="4 15 4 20 9 20" /><polyline points="20 15 20 20 15 20" /></svg>
        </button>
      </div>
      <button class="lb__close" onclick="event.stopPropagation();closeLightbox()" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
      </button>
      <button class="lb__nav lb__nav--prev" onclick="event.stopPropagation();lbNav(-1)" aria-label="Previous">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></svg>
      </button>
      <button class="lb__nav lb__nav--next" onclick="event.stopPropagation();lbNav(1)" aria-label="Next">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></svg>
      </button>
      <div class="lb__counter" id="lbCounter"></div>
    </div>`;
  // Swipe on touch screens. Horizontal only, so a vertical drag never pages, and
  // never while zoomed or after a pinch: then a drag moves around the image.
  const lb = host.firstElementChild;
  let x0 = null, y0 = null;
  lb.addEventListener("touchstart", e => {
    if (e.touches.length > 1 || lbZ.s > 1.01) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  lb.addEventListener("touchend", e => {
    if (x0 === null || lbZ.s > 1.01 || lbZ.pinched) { x0 = null; return; }
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) lbNav(dx < 0 ? 1 : -1);
  });
  lbBindZoom(lb, document.getElementById("lbImg"));
}

/* ---------------- Lightbox zoom ----------------
   The image is scaled and moved with a CSS transform (origin: its centre), so
   nothing reflows. Wheel and pinch zoom toward the pointer; a click zooms into
   the spot clicked, and a second click fits it back; a drag moves around while
   zoomed. The most you can zoom is whatever shows the image at about 1.5x its
   real pixels (min 3x, max 8x), so a 4000px floor plan stays sharp. */
const lbZ = { s: 1, x: 0, y: 0, pinched: false };
let lbDraggedAt = 0;
// Sizes come from layout (offsetWidth etc.), which a transform never changes, so
// they hold even mid-animation. The .lb backdrop is fixed at 0,0, so offsets
// relative to it are screen coordinates.
function lbMaxScale() {
  const img = document.getElementById("lbImg");
  if (!img || !img.naturalWidth) return 4;
  return Math.max(3, Math.min(8, (img.naturalWidth / Math.max(img.offsetWidth, 1)) * 1.5));
}
function lbApply(ease) {
  const img = document.getElementById("lbImg");
  if (!img) return;
  // Keep the image covering the view: it can't be dragged off past its edges.
  const w = img.offsetWidth, h = img.offsetHeight;
  const mx = Math.max(0, (w * lbZ.s - window.innerWidth) / 2 + 40);
  const my = Math.max(0, (h * lbZ.s - window.innerHeight) / 2 + 40);
  if (lbZ.s <= 1) { lbZ.x = 0; lbZ.y = 0; }
  lbZ.x = Math.max(-mx, Math.min(mx, lbZ.x));
  lbZ.y = Math.max(-my, Math.min(my, lbZ.y));
  img.classList.toggle("is-easing", !!ease);
  img.style.transform = lbZ.s > 1 || lbZ.x || lbZ.y ? `translate(${lbZ.x}px, ${lbZ.y}px) scale(${lbZ.s})` : "";
  img.classList.toggle("is-zoomed", lbZ.s > 1.01);
  const out = document.getElementById("lbZoomOut"), inn = document.getElementById("lbZoomIn");
  if (out) out.disabled = lbZ.s <= 1.01;
  if (inn) inn.disabled = lbZ.s >= lbMaxScale() - 0.01;
}
// Zoom to scale s, keeping the screen point (px, py) where it is.
function lbZoomTo(s, px, py, ease) {
  const img = document.getElementById("lbImg");
  if (!img) return;
  s = Math.max(1, Math.min(lbMaxScale(), s));
  const cx = img.offsetLeft + img.offsetWidth / 2, cy = img.offsetTop + img.offsetHeight / 2; // untransformed centre
  if (px == null) { px = window.innerWidth / 2; py = window.innerHeight / 2; }
  lbZ.x = (px - cx) - ((px - cx) - lbZ.x) * (s / lbZ.s);
  lbZ.y = (py - cy) - ((py - cy) - lbZ.y) * (s / lbZ.s);
  lbZ.s = s;
  lbApply(ease);
  lbHideHint();
}
function lbZoomStep(dir) { lbZoomTo(lbZ.s * (dir > 0 ? 1.6 : 1 / 1.6), null, null, true); }
function lbZoomReset(ease) { lbZ.s = 1; lbZ.x = 0; lbZ.y = 0; lbZ.pinched = false; lbApply(ease); }
function lbHideHint() { const h = document.getElementById("lbHint"); if (h) h.classList.add("is-gone"); }
// A drag that ends over the backdrop must not count as a click that closes it.
function lbBackdropClick() { if (Date.now() - lbDraggedAt > 300) closeLightbox(); }
function lbBindZoom(lb, img) {
  lb.addEventListener("wheel", e => {
    e.preventDefault();
    lbZoomTo(lbZ.s * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY, false);
  }, { passive: false });
  const pts = new Map();
  let start = null; // drag or pinch in progress
  img.addEventListener("pointerdown", e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { img.setPointerCapture(e.pointerId); } catch {} // keeps the drag if the pointer leaves the image
    start = pts.size === 2
      ? { pinch: true, d: lbPtsDist(pts), s: lbZ.s }
      : { pinch: false, x: e.clientX, y: e.clientY, ox: lbZ.x, oy: lbZ.y, moved: false };
    if (pts.size === 2) lbZ.pinched = true;
  });
  img.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId) || !start) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (start.pinch && pts.size === 2) {
      const [a, b] = [...pts.values()];
      lbZoomTo(start.s * (lbPtsDist(pts) / start.d), (a.x + b.x) / 2, (a.y + b.y) / 2, false);
    } else if (!start.pinch && lbZ.s > 1.01) {
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) { start.moved = true; img.classList.add("is-dragging"); }
      lbZ.x = start.ox + dx; lbZ.y = start.oy + dy;
      lbApply(false);
    }
  });
  const end = e => {
    pts.delete(e.pointerId);
    img.classList.remove("is-dragging");
    if (start && (start.moved || start.pinch)) lbDraggedAt = Date.now();
    if (pts.size === 0) start = null;
    else if (pts.size === 1) { const [p] = [...pts.values()]; start = { pinch: false, x: p.x, y: p.y, ox: lbZ.x, oy: lbZ.y, moved: true }; }
  };
  img.addEventListener("pointerup", end);
  img.addEventListener("pointercancel", end);
  // Click: zoom into that spot, or fit back if already zoomed. Not after a drag.
  img.addEventListener("click", e => {
    if (Date.now() - lbDraggedAt < 300) return;
    if (lbZ.s > 1.01) lbZoomReset(true);
    else lbZoomTo(Math.min(2.5, lbMaxScale()), e.clientX, e.clientY, true);
  });
}
function lbPtsDist(pts) { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; }
function showLightboxPhoto() {
  const img = document.getElementById("lbImg");
  const counter = document.getElementById("lbCounter");
  if (!img) return;
  const total = lbList.length;
  const i = lbIndex;
  const src = lbList[i];
  const token = ++lbToken;
  counter.textContent = lbNames
    ? (total > 1 ? `${lbNames[i]} · ${i + 1} / ${total}` : lbNames[i])
    : `${String(i + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}`;
  const swap = () => {
    if (token !== lbToken) return; // a later arrow press has already moved on
    if (img.getAttribute("src") !== src) lbZoomReset(false); // each image opens fitted
    img.src = src;
    img.alt = lbNames ? lbNames[i] : `Photo ${i + 1} of ${total}`;
    img.classList.remove("is-loading");
  };
  const next = lbPreload(i);
  // First open: show the photo straight away; the zoom-in covers its arrival.
  if (!img.getAttribute("src") || (next.complete && next.naturalWidth)) swap();
  else {
    img.classList.add("is-loading");
    (next.decode ? next.decode() : Promise.reject()).then(swap, () => { next.onload = swap; next.onerror = swap; if (next.complete) swap(); });
  }
  lbPreload(i + 1);
  lbPreload(i - 1);
}
function openLightbox(i, list = photos, names = null) {
  if (!list.length) return;
  // Switching between photos and plans: drop the old image so the first one
  // of the new set shows at once instead of fading from the wrong picture.
  if (list !== lbList) { const old = document.getElementById("lbImg"); if (old) old.removeAttribute("src"); }
  lbList = list;
  lbNames = names;
  lbIndex = i;
  if (!document.getElementById("lbImg")) {
    buildLightbox();
    setTimeout(lbHideHint, 4500);
  }
  lbZoomReset(false);
  document.getElementById("lbImg").classList.toggle("is-plan", !!names);
  document.querySelector(".lb__nav--prev").hidden = document.querySelector(".lb__nav--next").hidden = list.length < 2;
  showLightboxPhoto();
  document.body.style.overflow = "hidden";
}
function closeLightbox() {
  lbIndex = null;
  lbToken++;
  document.getElementById("lbHost").innerHTML = "";
  document.body.style.overflow = "";
}
function lbNav(dir) {
  if (lbIndex === null || lbList.length < 2) return;
  lbIndex = (lbIndex + dir + lbList.length) % lbList.length;
  showLightboxPhoto();
}

/* ---------------- Floor plans (tabs + zoom) ---------------- */
function showFloorPlan(k) {
  const sec = document.getElementById("floor-plans");
  if (!sec) return;
  sec.querySelectorAll("[data-fp]").forEach(el => {
    const on = el.dataset.fp === String(k);
    if (el.getAttribute("role") === "tab") el.setAttribute("aria-selected", on);
    else el.hidden = !on;
  });
  const panel = document.getElementById("fpPanel" + k);
  // Images size to their own shape; the embed keeps the tall fixed frame,
  // unless it reports its own height.
  const isImage = !!panel && panel.classList.contains("floorplan__panel--image");
  const frame = document.getElementById("fpFrame");
  frame.classList.toggle("is-image", isImage);
  frame.classList.toggle("is-auto", !isImage && fpAutoHeight);
}
function openPlanZoom(n) {
  openLightbox(n, fpImages, fpNames);
}
// Hidden plan tabs don't load until shown, so the first click on each used to
// wait for its download. Fetch them all once the section comes near the screen;
// a tab then shows its plan at once, from the browser cache.
function preloadFloorPlans() {
  const sec = document.getElementById("floor-plans");
  if (!sec || fpImages.length < 2) return;
  const go = () => fpImages.forEach(u => { const i = new Image(); i.decoding = "async"; i.src = u; });
  if (!("IntersectionObserver" in window)) return go();
  const io = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { io.disconnect(); go(); } }, { rootMargin: "800px 0px" });
  io.observe(sec);
}

/* ---------------- 3D tour, played in place ---------------- */
// Matterport links come in a few shapes (/show/?m=ID, /models/ID). The model ID
// is all the player needs.
function matterportId(url) {
  try {
    const u = new URL(String(url || "").trim());
    if (!/(^|\.)matterport\.com$/i.test(u.hostname)) return null;
    const id = u.searchParams.get("m") || (u.pathname.match(/\/models\/([A-Za-z0-9]+)/) || [])[1];
    return id && /^[A-Za-z0-9]{8,}$/.test(id) ? id : null;
  } catch { return null; }
}
// What the tour frame loads. A Matterport tour starts straight away (play=1),
// since the visitor has already clicked to launch it. Any other https link Grant
// enters is loaded as it is.
function tourEmbedSrc(url) {
  const id = matterportId(url);
  if (id) return `https://my.matterport.com/show/?m=${id}&play=1&qs=1`;
  try { const u = new URL(String(url || "").trim()); return u.protocol === "https:" ? u.href : null; } catch { return null; }
}
let tourSrc = null;
// Swaps the cover card for the tour itself, so the visitor never leaves the page.
// The frame is only created on click: a Matterport tour is heavy to load.
function playTour() {
  const card = document.getElementById("tourCard");
  if (!card || !tourSrc || card.classList.contains("is-playing")) return;
  card.classList.add("is-playing");
  card.removeAttribute("role");
  card.removeAttribute("tabindex");
  card.removeAttribute("aria-label");
  card.innerHTML = `<iframe src="${escapeHtml(tourSrc)}" title="${escapeHtml(card.dataset.title || "3D tour")}" allow="fullscreen; xr-spatial-tracking; autoplay" allowfullscreen></iframe>`;
}
function tourKey(e) {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); playTour(); }
}

/* ---------------- Property gallery (mosaic + Load more) ---------------- */
const GALLERY_STEP = 24;
let galleryShown = 0;
// Tile shape for photo i of total. Whole 12-photo cycles use the mosaic
// pattern; the last, partial cycle is laid out to fill its rows exactly:
// wide tiles first (2 cells each) until the cell count is a multiple of 4, then
// small ones. A single leftover photo runs the full width.
function galleryTileClass(i, total) {
  const rem = total % 12;
  const tailStart = total - rem;
  if (i < tailStart) {
    const p = i % 12;
    if (p === 0) return " pgallery__tile--big";
    if (p === 5 || p === 6) return " pgallery__tile--wide";
    if (p === 9) return " pgallery__tile--right";
    return "";
  }
  if (rem === 1) return " pgallery__tile--full";
  const wides = (4 - (rem % 4)) % 4;
  return (i - tailStart) < wides ? " pgallery__tile--wide" : "";
}
function galleryTiles(from, to) {
  let html = "";
  for (let i = from; i < to; i++) {
    html += `<button type="button" class="pgallery__tile${galleryTileClass(i, photos.length)}" onclick="openLightbox(${i})" aria-label="Open photo ${i + 1} of ${photos.length}">` +
      `<img src="${escapeHtml(photos[i])}" alt="" loading="${i < 6 ? "eager" : "lazy"}" decoding="async" /></button>`;
  }
  return html;
}
function syncGalleryFoot() {
  const more = document.getElementById("galleryMore");
  const count = document.getElementById("galleryCount");
  const left = photos.length - galleryShown;
  if (count) {
    count.textContent = `Showing ${galleryShown} of ${photos.length} photos`;
    // Nothing was ever held back, so there is nothing to count.
    count.hidden = photos.length <= GALLERY_STEP;
  }
  if (more) {
    more.hidden = left <= 0;
    more.textContent = left > GALLERY_STEP ? `Load ${GALLERY_STEP} more photos` : `Load the last ${left} photo${left === 1 ? "" : "s"}`;
  }
}
function loadMoreGallery() {
  const grid = document.getElementById("galleryGrid");
  if (!grid) return;
  const to = Math.min(photos.length, galleryShown + GALLERY_STEP);
  grid.insertAdjacentHTML("beforeend", galleryTiles(galleryShown, to));
  const first = grid.children[galleryShown];
  galleryShown = to;
  syncGalleryFoot();
  // Keyboard users land on the first new photo rather than back at the button.
  if (first) first.focus({ preventScroll: true });
}

/* ---------------- Embeds (Grant's videos, the floor plan) ----------------
   The admin fields take a plain link or pasted embed code. Embed code is
   reduced to its iframe src; anything that isn't an http(s) URL is dropped. */
function embedSources(raw) {
  const text = String(raw || "");
  const fromIframes = [...text.matchAll(/<iframe[^>]*\ssrc=["']([^"']+)["']/gi)].map(m => m[1]);
  const list = fromIframes.length ? fromIframes : text.split(/\s*\n\s*/);
  return list.map(s => s.trim().replace(/&amp;/g, "&")).filter(s => /^https?:\/\//i.test(s));
}
// Embeds that size themselves (DX's interactive floor plans use iframe-resizer:
// the plan page reports its own height and the frame grows to fit, so there is
// no inner scrollbar and no empty space). Recognised from the pasted code, or
// from the host when only the link was pasted. The pasted <script> tags are
// never run; the matching library is loaded from cdnjs instead.
function embedSizesItself(raw, src) {
  return /iFrameResize|iframe-?resizer/i.test(String(raw || "")) || /(^|\.)dx\.media$/i.test(new URL(src).hostname);
}
let iframeResizerLoad = null;
function autoSizeFloorPlan() {
  const frame = document.getElementById("fpEmbed");
  if (!frame || !fpAutoHeight) return;
  iframeResizerLoad ||= new Promise((resolve, reject) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.2.11/iframeResizer.min.js";
    sc.onload = resolve;
    sc.onerror = reject;
    document.head.appendChild(sc);
  });
  // If the library can't load, the frame simply keeps its default height.
  iframeResizerLoad.then(() => window.iFrameResize({ checkOrigin: [new URL(frame.src).origin], log: false }, frame), () => {});
}
function videoEmbed(url) {
  let m;
  if ((m = url.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/i)))
    return { kind: "iframe", src: `https://www.youtube-nocookie.com/embed/${m[1]}?rel=0` };
  if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([\da-f]+))?/i)))
    return { kind: "iframe", src: `https://player.vimeo.com/video/${m[1]}${m[2] ? "?h=" + m[2] : ""}` };
  if (/\.(mp4|webm|m4v|mov)(?:[?#]|$)/i.test(url)) return { kind: "file", src: url };
  // Any other player (Wistia, Loom, the photographer's own host) is embedded as given.
  return { kind: "iframe", src: url };
}
function videoHtml(v, label) {
  const src = escapeHtml(v.src);
  return v.kind === "file"
    ? `<div class="note-media__video"><video src="${src}" controls playsinline preload="metadata" aria-label="${escapeHtml(label)}"></video></div>`
    : `<div class="note-media__video"><iframe src="${src}" title="${escapeHtml(label)}" loading="lazy" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe></div>`;
}
document.addEventListener("keydown", e => {
  if (lbIndex === null) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") lbNav(-1);
  if (e.key === "ArrowRight") lbNav(1);
  if (e.key === "+" || e.key === "=") lbZoomStep(1);
  if (e.key === "-" || e.key === "_") lbZoomStep(-1);
  if (e.key === "0") lbZoomReset(true);
});

/* ---------------- Render ---------------- */
function render(listing, photoUrls, marketIntel, area, contact, grantIntro, syncedAt, history) {
  // Only ever a genuine number: the API's realPhone() returns null for the
  // placeholders still sitting in the CMS, and the footer line is omitted
  // rather than printing something a buyer might dial.
  const contactPhone = (contact && contact.phone) || "";
  photos = photoUrls;
  lbIndex = null;
  galleryShown = Math.min(photos.length, GALLERY_STEP);

  const descHtml = listing.descriptionHtml || "<p>Contact Grant for full details on this exceptional Incline Village property.</p>";
  const descBlock = `
    <div class="prop-desc" id="propDesc">
      <div class="prop-desc__body" id="propDescBody">${descHtml}</div>
      ${canEdit ? `<div class="prop-desc__flag">${listing.descriptionIsCustom ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9" /><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg> Custom description (edited). ` : ""}<a href="/_emdash/admin/content/listings/${listing.homeId || listing.id}?locale=en" target="_blank" rel="noopener">Edit description in the backend <span class="cta-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></svg></span></a></div>` : ""}
    </div>`;

  const note = listing.ownerNote || "";
  // Grant's content switch (2026-11-09): with it off the API sends none of his
  // fields and the MLS text shows. A logged-in admin sees why, with the way back on.
  const grantOff = canEdit && listing.showGrant === false ? `
    <div class="grant-off">Grant's content is switched off for this home (it shows the MLS description; the headline, note, tours and floor plans stay saved). It is off by default when Grant is not the listing agent. <a href="/_emdash/admin/content/listings/${listing.homeId || listing.id}?locale=en" target="_blank" rel="noopener">Switch it on in the backend</a>.</div>` : "";
  const noteBlock = (note || canEdit) ? `
    <div class="grant-note${note ? "" : " grant-note--empty"}" id="grantNote">
      <div class="eyebrow grant-note__label">A Note From Grant</div>
      <div class="grant-note__body" id="grantNoteBody">${note ? noteToHtml(note) : "<em>No note yet — add a personal note about this property.</em>"}</div>
      ${canEdit ? `
      <button class="grant-note__btn" id="noteEditBtn" onclick="toggleNoteEdit()">${note ? "Edit note" : "Add note"}</button>
      <div class="grant-note__editor" id="noteEditor" style="display:none">
        <textarea id="noteText" rows="4" placeholder="Add a personal note about this property…">${note ? escapeHtml(note) : ""}</textarea>
        <div class="grant-note__actions">
          <button class="grant-note__btn grant-note__btn--save" onclick="saveNote()">Save note</button>
          <button class="grant-note__btn" onclick="toggleNoteEdit()">Cancel</button>
          <span id="noteStatus" class="grant-note__status"></span>
        </div>
      </div>
      <div class="grant-note__more"><a href="/_emdash/admin/content/listings/${listing.homeId || listing.id}?locale=en" target="_blank" rel="noopener">Add a photo or videos, or the floor plan, in the backend</a></div>` : ""}
    </div>` : "";

  // .listing-hero__img is a background-image layer in styles.css, not an <img>.
  const heroLayer = photos[0]
    ? `<div class="listing-hero__img" style="background-image:url('${photos[0]}')"></div>`
    : `<div class="listing-hero__img" style="background:var(--navy)"></div>`;

  // The neighbourhood is derived per listing by point-in-polygon matching; fall
  // back to city/state when a listing sits outside every traced area.
  let crumb = listing.neighborhood || [listing.city, listing.state].filter(Boolean).join(", ");

  // Status (2026-11-03). Under-contract and pending homes stay on the site now,
  // and sold ones live on from the archive with one photo and the close facts.
  // Liz's labels come from the API (statusLabel); "On market" gets no badge here.
  const sold = listing.sold || null;
  const statusText = listing.statusLabel || "On market";
  const statusBadge = statusText === "On market" ? "" :
    `<div class="listing-hero__status${sold ? " listing-hero__status--sold" : ""}${statusText === "Off market" ? " listing-hero__status--off" : ""}">${escapeHtml(statusText)}</div>`;
  if (sold && sold.representedLabel) crumb = `${crumb} · ${sold.representedLabel}`;
  // 2026-11-09 (Liz): under the address, one orange block reading
  // "Neighborhood: <name>". Grant's side on a sold home is its own block beside
  // it. A home outside every traced area keeps its plain city/state block.
  const heroTags = [
    listing.neighborhood ? `Neighborhood: ${listing.neighborhood}` : [listing.city, listing.state].filter(Boolean).join(", "),
    sold && sold.representedLabel,
  ].filter(Boolean);
  const heroTagsBlock = heroTags.length
    ? `<div class="listing-hero__tags">${heroTags.map(x => `<div class="listing-hero__crumb">${escapeHtml(x)}</div>`).join("")}</div>`
    : "";

  // Listing brokerage, MLS number, source and last update (compliance thread,
  // 2026-11-06). IDX rules: name the listing brokerage on every listing, readable,
  // never Grant's name in place of a blank agent. "Last updated" is the last sync
  // for a live listing; a sold one no longer syncs, so it is the MLS's own date.
  const creditWho = [listing.agent, listing.office].filter(Boolean).join(", ");
  const heroCredit = creditWho ? `<div class="listing-hero__credit">Listing courtesy of ${escapeHtml(creditWho)}</div>` : "";
  const updatedOn = fmtDay(listing.archived ? listing.updated : (syncedAt || listing.updated));

  // Listing history: every MLS listing of this home, newest first, in a closed
  // accordion under Features & Amenities. Built server-side (listingHistory in
  // src/lib/listings.ts); off-market rows only arrive for a logged-in admin.
  const hist = Array.isArray(history) ? history : [];
  const fmtChange = c => {
    if (c == null || !isFinite(c) || c === 0) return "";
    const pct = Math.abs(c * 100).toFixed(1).replace(/\.0$/, "");
    return `<span class="lhist__chg">${c < 0 ? "\u2212" : "+"}${pct}%</span>`;
  };
  const historyBlock = hist.length ? `
        <details class="lhist" id="listing-history">
          <summary class="lhist__sum">
            <span>Listing History</span>
            <span class="lhist__count">${hist.length} ${hist.length === 1 ? "event" : "events"}</span>
            <svg class="lhist__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9" /></svg>
          </summary>
          <div class="lhist__body">
            <table class="lhist__table">
              <thead><tr><th scope="col">Date</th><th scope="col">Event</th><th scope="col">Price</th></tr></thead>
              <tbody>
                ${hist.map(e => `
                <tr${e.adminOnly ? ' class="lhist__row--admin"' : ""}>
                  <td>${escapeHtml(fmtDay(e.date) || "")}</td>
                  <td>${escapeHtml(e.event)}${e.adminOnly ? '<span class="lhist__tag">Only admins see this</span>' : ""}</td>
                  <td>${e.price ? fmt(e.price) : "&mdash;"}${fmtChange(e.change)}</td>
                </tr>`).join("")}
              </tbody>
            </table>
            <p class="lhist__note">From the Incline Village Realtors&reg; MLS. Every price change is recorded from November 2026; before that, only each listing's latest change is known.</p>
          </div>
        </details>` : "";
  const listingInfo = `
    <div class="listing-info">
      ${creditWho ? `<div class="listing-info__row"><span class="listing-info__l">Listing courtesy of</span> ${escapeHtml(creditWho)}</div>` : ""}
      ${listing.mlsNumber ? `<div class="listing-info__row"><span class="listing-info__l">MLS #</span> ${escapeHtml(listing.mlsNumber)}</div>` : ""}
      <div class="listing-info__row"><span class="listing-info__l">Source</span> Incline Village Realtors&reg; MLS</div>
      ${updatedOn ? `<div class="listing-info__row"><span class="listing-info__l">Last updated</span> ${escapeHtml(updatedOn)}</div>` : ""}
    </div>`;

  // Return the visitor to the search they came from, filters intact. The listings
  // page stashes its current URL (including the filter query string) on every
  // change; fall back to the unfiltered index when there is nothing stored.
  let backHref = listing.archived ? "/sold/" : "/listings/";
  let backLabel = listing.archived ? "Back to Recently Sold" : "Back to All Listings";
  try {
    if (listing.archived) throw new Error("archived: keep the sold link");
    const stored = sessionStorage.getItem("gcm:listingsUrl");
    if (stored) {
      backHref = stored;
      if (stored.indexOf("?") > -1) backLabel = "Back to Your Search";
    }
  } catch (e) { /* private mode — keep the default */ }

  // Sits in the description column, under the description. The first
  // GALLERY_STEP photos render now; "Load more" appends the rest in steps.
  // A sold listing keeps only its lead photo, already shown in the hero.
  const gallery = (photos.length > 0 && !listing.archived) ? `
    <div class="pgallery" id="propGallery">
      <div class="pgallery__head">
        <h3 class="pgallery__h">Property Gallery</h3>
        <div class="eyebrow eyebrow--muted">${photos.length} Photo${photos.length === 1 ? "" : "s"}</div>
      </div>
      <div class="pgallery__grid" id="galleryGrid">${galleryTiles(0, galleryShown)}</div>
      <div class="pgallery__foot">
        <span class="pgallery__count" id="galleryCount"></span>
        <button type="button" class="pgallery__more" id="galleryMore" onclick="loadMoreGallery()"></button>
      </div>
    </div>` : "";

  // ---- Floor plans: an interactive embed (e.g. the DX floor map) from the
  //      admin's floor_plan_embed field, and/or uploaded plan images from
  //      floor_plan_images. More than one view gets tabs. Hidden, along with
  //      its jump link in Quick Statistics, when both are empty. ----
  const floorPlanSrc = embedSources(listing.floorPlanEmbed)[0] || "";
  fpAutoHeight = !!floorPlanSrc && embedSizesItself(listing.floorPlanEmbed, floorPlanSrc);
  const planImages = Array.isArray(listing.floorPlanImages) ? listing.floorPlanImages : [];
  fpImages = planImages.map(p => p.url);
  fpNames = planImages.map((p, n) => p.label || (planImages.length > 1 ? `Plan ${n + 1}` : "Floor plan"));
  const fpViews = [
    ...(floorPlanSrc ? [{ kind: "embed", label: "Interactive plan" }] : []),
    ...planImages.map((p, n) => ({ kind: "image", label: fpNames[n], n })),
  ];
  const arrow = `<span class="cta-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></svg></span>`;
  const fpAction = (v, k) => v.kind === "embed"
    ? `<a class="floorplan__open" data-fp="${k}" href="${escapeHtml(floorPlanSrc)}" target="_blank" rel="noopener"${k ? " hidden" : ""}>Open full screen ${arrow}</a>`
    : `<button type="button" class="floorplan__open" data-fp="${k}" onclick="openPlanZoom(${v.n})"${k ? " hidden" : ""}>View larger ${arrow}</button>`;
  const fpPanel = (v, k) => v.kind === "embed"
    ? `<div class="floorplan__panel" id="fpPanel${k}" role="tabpanel" data-fp="${k}"${k ? " hidden" : ""}>
         <iframe id="fpEmbed" src="${escapeHtml(floorPlanSrc)}" title="Interactive floor plan of ${escapeHtml(listing.address)}" loading="lazy" allow="fullscreen; xr-spatial-tracking" allowfullscreen></iframe>
       </div>`
    : `<div class="floorplan__panel floorplan__panel--image" id="fpPanel${k}" role="tabpanel" data-fp="${k}"${k ? " hidden" : ""}>
         <button type="button" class="floorplan__img" onclick="openPlanZoom(${v.n})" aria-label="View ${escapeHtml(v.label)} larger">
           <img src="${escapeHtml(fpImages[v.n])}" alt="${escapeHtml(v.label)} floor plan of ${escapeHtml(listing.address)}" loading="lazy" decoding="async" />
         </button>
         <span class="floorplan__zoomhint" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.5" y2="16.5" /><line x1="11" y1="8" x2="11" y2="14" /><line x1="8" y1="11" x2="14" y2="11" /></svg>Click to zoom</span>
       </div>`;
  const floorPlanSection = fpViews.length ? `
    <section class="floorplan" id="floor-plans">
      <div class="floorplan__head">
        <div>
          <div class="eyebrow">${floorPlanSrc ? "Interactive Floor Plan" : (planImages.length > 1 ? "Floor Plans" : "Floor Plan")}</div>
          <h2 class="floorplan__h">Find your way around ${escapeHtml(listing.address)}</h2>
        </div>
        <div class="floorplan__actions">${fpViews.map(fpAction).join("")}</div>
      </div>
      ${fpViews.length > 1 ? `
      <div class="floorplan__tabs" role="tablist" aria-label="Floor plans">
        ${fpViews.map((v, k) => `<button type="button" role="tab" class="floorplan__tab" data-fp="${k}" aria-controls="fpPanel${k}" aria-selected="${k === 0}" onclick="showFloorPlan(${k})">${escapeHtml(v.label)}</button>`).join("")}
      </div>` : ""}
      <div class="floorplan__frame${fpViews[0].kind === "image" ? " is-image" : (fpAutoHeight ? " is-auto" : "")}" id="fpFrame">
        ${fpViews.map(fpPanel).join("")}
      </div>
    </section>` : "";

  // ---- Location map: a keyless Google Maps embed (output=embed), as on the other
  //      Bidview sites. The feed writes units without a "#" ("807 Alder Avenue 82"),
  //      so a trailing unit after a street-type word is dropped and Google pins the
  //      building. No street address -> the MLS coordinates. Hidden with neither. ----
  const mapLatLng = Number(listing.lat) && Number(listing.lng) ? [Number(listing.lat), Number(listing.lng)] : null;
  const street = String(listing.address || "").trim()
    .replace(/^(.*\b(?:Avenue|Ave|Drive|Dr|Street|St|Road|Rd|Way|Boulevard|Blvd|Court|Ct|Lane|Ln|Circle|Cir|Place|Pl|Highway|Hwy|Trail|Terrace|Route \d+))\s+#?[\w-]+$/i, "$1");
  const mapQuery = /\d/.test(street)
    ? [street, listing.city, [listing.state, listing.zip].filter(Boolean).join(" ")].filter(Boolean).join(", ")
    : (mapLatLng ? mapLatLng.join(",") : "");
  const mapSrc = mapQuery ? `https://maps.google.com/maps?q=${encodeURIComponent(mapQuery)}&z=15&output=embed` : "";
  const directions = mapLatLng ? `https://www.google.com/maps/dir/?api=1&destination=${mapLatLng[0]},${mapLatLng[1]}`
    : (mapQuery ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(mapQuery)}` : "");
  const mapSection = mapSrc ? `
    <section class="listing-map" id="location">
      <div class="listing-map__head">
        <div>
          <div class="eyebrow">Location</div>
          <h2 class="floorplan__h">Where you'll find ${escapeHtml(listing.address)}</h2>
        </div>
        <a class="floorplan__open" href="${directions}" target="_blank" rel="noopener">Get directions ${arrow}</a>
      </div>
      <div class="listing-map__frame">
        <iframe class="listing-map__map" src="${escapeHtml(mapSrc)}" title="Map showing ${escapeHtml(listing.address)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      </div>
      ${listing.neighborhood && listing.neighborhoodSlug ? `
      <p class="listing-map__area">In the <a href="/neighborhood/${escapeHtml(listing.neighborhoodSlug)}/">${escapeHtml(listing.neighborhood)}</a> neighborhood of ${escapeHtml(listing.city || "Incline Village")}.</p>` : ""}
    </section>` : "";

  // Real MLS fields, in the design's card treatment.
  const featureCards = [
    ["Bedrooms & Baths", [
      ["Bedrooms", listing.beds], ["Bathrooms Total", listing.baths],
      ["Full Baths", listing.bathsFull], ["Half Baths", listing.bathsHalf],
    ]],
    ["Area & Lot", [
      ["Living Area", fmtSqft(listing.sqft)],
      ["Lot Size", listing.lotAcres ? listing.lotAcres + " acres" : "—"],
      ["Year Built", listing.yearBuilt], ["Type", fmtEnum(listing.type)],
    ]],
    ["Property Info", [
      ["Garage", listing.garage ? listing.garage + " spaces" : "—"],
      ["View", fmtEnum(listing.view) || "—"], ["Sub-Type", fmtEnum(listing.subType) || "—"], ["Status", statusText],
    ]],
    ["Financial", sold ? [
      // A sold listing: the close facts instead of a days-on-market that would
      // keep counting to today.
      ["Sold Price", fmt(sold.closePrice || listing.price)],
      ["Closed", fmtDate(sold.closeDate)],
      ["List Price", fmt(listing.price)],
      ["Annual Taxes", listing.taxes ? fmt(listing.taxes) : "—"],
      ["Listing Agent", listing.agent || "—"],
      ["Listing Office", listing.office || "—"],
    ] : [
      ["List Price", fmt(listing.price)],
      ["Annual Taxes", listing.taxes ? fmt(listing.taxes) : "—"],
      ["Days on Market", listing.daysOnMarket ?? "—"],
      ...totalDomRows(listing),
      ["Listing Agent", listing.agent || "—"],
      ["Listing Office", listing.office || "—"],
    ]],
  ];

  // ---- B3: Note From Grant as its own section, in the design's .local-card ----
  // Shown to everyone whenever a note, image or video exists. The inline editor
  // stays in the body column for logged-in admins so editing still happens in
  // one place. Media is set in the backend: note_image, plus note_videos (one
  // link per line). Videos come first; an image alongside them follows.
  const noteVideos = embedSources(listing.noteVideos).map(videoEmbed);
  const noteMediaItems = [
    ...noteVideos.map((v, i) => videoHtml(v, noteVideos.length > 1 ? `A video from Grant (${i + 1} of ${noteVideos.length})` : "A video from Grant")),
    ...(listing.noteImage ? [`<div class="local-card__photo" style="background-image:url('${escapeHtml(listing.noteImage)}')"></div>`] : []),
  ];
  const noteMedia = noteMediaItems.length === 1 && !noteVideos.length
    ? noteMediaItems[0]
    : noteMediaItems.length ? `<div class="note-media">${noteMediaItems.join("")}</div>` : "";
  const localSection = (note || noteMedia) ? `
    <section class="section--local">
      <div class="local-card">
        <div class="local-card__copy">
          <div class="local-card__head">
            <div class="local-card__lead">Where Local Knowledge Makes the Difference</div>
            <div class="local-card__title">A Note From Grant</div>
          </div>
          ${note ? `
          <div class="local-card__body">
            <p>${noteToHtml(note)}</p>
          </div>` : ""}
          <div class="local-card__attr" style="color:var(--orange)">&mdash; GRANT C. MEYER</div>
        </div>
        ${noteMedia}
      </div>
    </section>` : "";

  // ---- B2: 3D tour. Hidden entirely when there is no tour to play. Grant's 3D Tour
  //      URL wins; otherwise the API passes on the MLS tour link only when it is a
  //      Matterport. Clicking the card plays the tour in place (playTour). ----
  tourSrc = tourEmbedSrc(listing.tourUrl);
  const tourSection = tourSrc ? `
    <section class="tour-band" id="tour">
      <div class="matterport" id="tourCard" role="button" tabindex="0" aria-label="Launch the 3D tour"
           data-title="3D tour of ${escapeHtml(listing.address)}" onclick="playTour()" onkeydown="tourKey(event)">
        ${photos[0] ? `<div class="matterport__bg" style="background-image:url('${photos[0]}')"></div>` : ""}
        <div class="matterport__inner">
          <div class="matterport__play">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="color:#fff;margin-left:3px"><path d="M8 5v14l11-7z" /></svg>
          </div>
          <h3 class="matterport__h">Experience ${escapeHtml(listing.address)} in 3D</h3>
          <p class="matterport__p">Take a virtual walk through every room of this residence before you set foot in Tahoe.</p>
          <span class="matterport__cta">Launch 3D Tour</span>
        </div>
      </div>
    </section>` : "";

  // ---- B4: Market Intelligence. Hidden until a post exists for this area, so no
  //      invented figures can ever ship. Bars are omitted when a percentage cannot
  //      be parsed, rather than drawn at an arbitrary width. ----
  const mi = marketIntel;
  const ratioPct = mi && mi.list_to_sale ? (String(mi.list_to_sale).match(/([\d.]+)\s*%/) || [])[1] : null;
  const marketSection = mi ? `
    <section class="section--market">
      <div class="market-card">
        <div class="market-card__top">
          <h3 class="market-card__h">Market Intelligence: ${escapeHtml(mi.title || listing.neighborhood || "")}</h3>
          ${mi.period ? `<div class="market-card__chip">${escapeHtml(mi.period)}</div>` : ""}
        </div>
        ${mi.summary ? `<p class="market-card__desc">${escapeHtml(mi.summary)}</p>` : ""}
        <div class="market-card__metrics">
          ${mi.list_to_sale ? `
          <div class="metric">
            <div class="metric__head">
              <div class="eyebrow eyebrow--navy">AVG. LIST-TO-SALE RATIO</div>
              <div class="metric__v">${escapeHtml(mi.list_to_sale)}</div>
            </div>
            ${ratioPct ? `<div class="metric__bar"><div class="metric__bar__fill" style="width:${ratioPct}%"></div></div>` : ""}
            ${mi.list_to_sale_note ? `<div class="metric__note">${escapeHtml(mi.list_to_sale_note)}</div>` : ""}
          </div>` : ""}
          ${mi.avg_dom ? `
          <div class="metric">
            <div class="metric__head">
              <div class="eyebrow eyebrow--navy">AVG. DAYS ON MARKET</div>
              <div class="metric__v">${escapeHtml(mi.avg_dom)}</div>
            </div>
            ${mi.avg_dom_note ? `<div class="metric__note">${escapeHtml(mi.avg_dom_note)}</div>` : ""}
          </div>` : ""}
        </div>
        ${mi.source ? `<div class="metric__note" style="margin-top:20px">${escapeHtml(mi.source)}</div>` : ""}
      </div>
    </section>` : "";

  // ---- B5: Community Insights, from the neighbourhood entry. ----
  // Two guards, both deliberate:
  //  1. The seeded neighbourhood entries still carry placeholder copy ("...goes here
  //     once we capture it"). Publishing that on every listing page would be worse
  //     than showing nothing, so placeholder paragraphs are dropped.
  //  2. The section is gated on having an image, because supplying one is the whole
  //     reason the featured/map image fields were added. No image = not ready = hidden.
  const PLACEHOLDER = /goes here once we capture it/i;
  const areaOverview = area && area.overview && !PLACEHOLDER.test(area.overview) ? area.overview : null;
  const areaTake = area && area.take && !PLACEHOLDER.test(area.take) ? area.take : null;
  const areaImage = area ? (area.map_image || area.featured_image) : null;
  const communitySection = (areaImage && (areaOverview || areaTake)) ? `
    <section class="section--community">
      <div class="community">
        <div class="community__copy">
          <div>
            <div class="community__head">
              <div class="eyebrow eyebrow--light">${escapeHtml(area.tag || listing.neighborhood || "")}</div>
              <div class="community__title">Community Insights</div>
            </div>
          </div>
          <div class="community__body">
            ${areaOverview ? `<p>${escapeHtml(areaOverview)}</p>` : ""}
            ${areaTake ? `<p>${escapeHtml(areaTake)}</p>` : ""}
          </div>
          ${listing.neighborhoodSlug ? `
          <div class="community__rows">
            <div class="community__row">
              <span class="community__row__icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" /></svg>
              </span>
              <div>
                <div class="community__row__h">${escapeHtml(area.title || "This area")}</div>
                <div class="community__row__p">Read the full neighborhood guide &mdash; <a href="/neighborhood/${listing.neighborhoodSlug}/" style="color:var(--orange)">explore ${escapeHtml(area.title || "the area")}</a></div>
              </div>
            </div>
          </div>` : ""}
        </div>
        <div class="community__map">
          <div class="community__map__img" style="background-image:url('${areaImage}')"></div>
        </div>
      </div>
    </section>` : "";

  /* The "Your Neighbor Before You Even Arrive" section. Everything in it comes
     from the `grant_intro` singleton via the API, which is the same entry and
     the same reader the home page's <GrantIntro> component uses -- so the copy
     cannot drift between the two. The classes are shared too (.grant-intro* in
     styles.css). If the markup below changes, change the component to match.
     The fallback keeps the section rendering if the API response predates the
     field, or the collection has not been pushed. */
  const gi = grantIntro || {};
  const giEyebrow = gi.eyebrow || "Your Neighbor Before You Even Arrive";
  const giHeadline = gi.headline || "Grant C. Meyer";
  const giPhoto = gi.photo || "/assets/grant.jpg";
  const giBody = gi.body || "";
  const giCta = gi.listingCtaLabel || "LET'S TALK ABOUT THIS PROPERTY";
  const guideCreds = (gi.creds && gi.creds.length ? gi.creds : []);
  const check = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" /></svg>`;

  // The table wrapper exists for one reason: Chrome repeats a real <tfoot>
  // at the foot of every printed page and reserves its height in the flow.
  // Nothing else does both. On screen the table, row group, row and cell are
  // all display: block and the tfoot is hidden, so the layout is unchanged.
  document.getElementById("app").innerHTML = `
    <table class="print-doc"><tbody class="print-doc__body"><tr><td>
    <div class="print-sheet" aria-hidden="true">
      ${photos[0] ? `<img class="print-sheet__img" src="${photos[0]}" alt="" />` : ""}
      <div class="print-sheet__head">
        <img class="print-sheet__logo" src="/assets/logo.png" alt="Grant C. Meyer Homes" />
        <div class="print-sheet__crumb">${escapeHtml(crumb)}</div>
      </div>
      <h1 class="print-sheet__addr">${escapeHtml(listing.address)}</h1>
      <div class="print-sheet__facts">
        <span>${listing.beds || "—"} BD</span>
        <span>${listing.baths || "—"} BA</span>
        ${listing.sqft ? `<span>${fmtSqft(listing.sqft)}</span>` : ""}
        <span class="print-sheet__price">${fmt(listing.price)}</span>
      </div>
      ${creditWho ? `<div class="print-sheet__credit">Listing courtesy of ${escapeHtml(creditWho)}${listing.mlsNumber ? ` · MLS # ${escapeHtml(listing.mlsNumber)}` : ""}</div>` : ""}
    </div>

    <section class="listing-hero listing-hero--fl">
      ${heroLayer}

/* ---- Saved homes ----------------------------------------------------------
   The heart marks a home in this browser and nothing more: the slug goes into
   localStorage under gcm:saved, and syncSaved() restores the filled state when
   the page is opened again. There is no account behind it and no "saved homes"
   page to view the list on yet -- if that gets built, this is the key it reads.
   Wrapped in try/catch throughout: localStorage throws outright in Safari
   private mode rather than returning null. */
const SAVED_KEY = "gcm:saved";

function readSaved() {
  try {
    const raw = localStorage.getItem(SAVED_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  } catch (e) { return []; }
}

function syncSaved() {
  const btn = document.getElementById("saveBtn");
  if (!btn || !currentSlug) return;
  const on = readSaved().indexOf(currentSlug) > -1;
  btn.setAttribute("aria-pressed", on ? "true" : "false");
  btn.setAttribute("aria-label", on ? "Saved — click to remove" : "Save this home");
  btn.title = on ? "Saved" : "Save";
  // Fill the heart as well as colour it, so the state reads at a glance.
  const svg = btn.querySelector("svg");
  if (svg) {
    svg.setAttribute("fill", on ? "currentColor" : "none");
    btn.style.color = on ? "var(--orange)" : "";
  }
}

function toggleSaved() {
  if (!currentSlug) return;
  try {
    const list = readSaved();
    const i = list.indexOf(currentSlug);
    if (i > -1) list.splice(i, 1); else list.push(currentSlug);
    localStorage.setItem(SAVED_KEY, JSON.stringify(list));
  } catch (e) { /* private mode — the button still reflects nothing, honestly */ }
  syncSaved();
}

async function load() {
  // Support both the SEO URL (/homes/city/address) and legacy (?id=key). URLs are
  // canonically trailing-slashed, so strip it — the API resolves bare slugs.
  const slug = location.pathname.match(/^\/homes\/(.+?)\/?$/)?.[1];
  const legacyId = new URLSearchParams(location.search).get("id");

  if (!slug && !legacyId) { location.href = "/listings/"; return; }
  currentSlug = slug || "";

  const endpoint = slug
    ? `${API}/api/listing-by-slug/${slug}`
    : `${API}/listing/${legacyId}`;

  try {
    const resp = await fetch(endpoint);
    const data = await resp.json();
    if (resp.status === 410 || data.gone) {
      // Expired, withdrawn or cancelled. The server answers 410 so search engines
      // drop the URL; a person who followed an old link gets somewhere to go.
      document.getElementById("app").innerHTML = `
        <div class="loading">
          <p>This listing is no longer available.</p>
          <p style="margin-top:14px"><a class="btn btn--dark" href="/listings/">SEARCH CURRENT LISTINGS</a> &nbsp; <a class="btn btn--dark" href="/sold/">RECENTLY SOLD</a></p>
        </div>`;
      return;
    }
    if (data.error) throw new Error(data.error);
    canEdit = !!data.canEdit;
    // An old URL (a per-listing or misspelt slug) answered for the home: put the
    // home's own URL in the address bar so copies and bookmarks carry the right one.
    if (data.canonicalSlug && slug && data.canonicalSlug !== slug) {
      currentSlug = data.canonicalSlug;
      try { history.replaceState(null, "", `/homes/${data.canonicalSlug}/`); } catch (e) { /* ignore */ }
    }
    render(data.listing, data.photos || [], data.marketIntel || null, data.area || null, data.contact || null, data.grantIntro || null, data.syncedAt || null, data.history || []);
  } catch (e) {
    document.getElementById("app").innerHTML = `<div class="loading">Failed to load listing: ${escapeHtml(e.message)}</div>`;
  }
}

load();
