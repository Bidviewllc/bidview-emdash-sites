<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Services hub, alternate states</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./d1.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%; background: #fff">
  <dc-import name="ServicesHub" palette="{{palette}}" hero="No photo · Primary" show-steps="{{false}}" reviews-link="{{false}}" cta-photo="{{false}}" show-controls="{{false}}" hint-size="100%,4800px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["Teal / Amber","Navy / Coral","Forest / Gold"],"default":"Teal / Amber","section":"Practice colors"},"$preview":{"width":1440,"height":4800}}'>
class Component extends DCLogic {
  renderVals() { return { palette: this.props.palette ?? 'Teal / Amber' }; }
}
</script>
</body>
</html>
